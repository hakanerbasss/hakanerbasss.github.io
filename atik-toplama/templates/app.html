<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Saha Yönetim</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a7a3c">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="app">

  <!-- Topbar -->
  <div id="topbar">
    <button class="iconbtn" id="menuBtn">☰</button>
    <div style="flex:1;overflow:hidden">
      <div class="name" id="nbTitle">Mahalle seçilmedi</div>
      <div class="progress" id="progressLabel">—</div>
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <button class="iconbtn" id="voiceBtn" title="Sesli yönlendirme">🔊</button>
  </div>

  <!-- Harita -->
  <div id="map"></div>

  <!-- Harita üzeri butonlar -->
  <div class="map-overlay" id="mapOverlay">
    <button id="locateBtn" title="Konumuma git">📍</button>
    <button id="nearestBtn" title="En yakın sokak">🧭</button>
    <button id="clearRouteBtn" title="Rotayı kapat" style="display:none;background:#b91c1c;border-color:#b91c1c;color:#fff">✕</button>
  </div>

  <!-- Alt bar (süpürgeci modu) -->
  <div id="bottombar" id="sweepBar">
    <button id="addNotifBtn" class="primary">⚠️ Bildirim</button>
    <button id="streetListBtn">🗺️ Sokaklar</button>
    <button id="notifPoolBtn">📋 Havuz</button>
  </div>

  <!-- Atama seçim çubuğu (#app içinde olmalı ki flex layout'ta görünsün) -->
  <div id="assignBar" style="display:none">
    <button id="assignBarBackBtn">← Geri</button>
    <div id="assignBarInfo">
      <b id="assignBarCount">0</b> sokak seçili
      <div id="assignBarTeam" style="font-size:10px;color:var(--muted)"></div>
    </div>
    <button id="assignBarListBtn">📋 Liste</button>
    <button id="assignBarAllBtn">Tümü</button>
    <button id="assignBarClearBtn">Sıfırla</button>
    <button class="primary" id="assignBarSaveBtn">✅ Kaydet</button>
  </div>

</div>

<!-- ── Menü modal ── -->
<div class="modal-overlay hidden" id="menuModal">
  <div class="modal">
    <h2>🏙️ Menü</h2>
    <label>Mahalle</label>
    <select id="nbSelect"><option value="">— Mahalle seç —</option></select>
    <div id="menuRoleSection"></div>
    <div class="row">
      <button id="menuCloseBtn">Kapat</button>
      <button class="danger" id="logoutBtn">Çıkış ({{ '{{user}}' }})</button>
    </div>
  </div>
</div>

<!-- ── Sokak kapat modal (fotoğrafla) ── -->
<div class="modal-overlay hidden" id="closeStreetModal">
  <div class="modal">
    <h2>🧹 Sokağı Kapat</h2>
    <div id="csStreetName" style="font-weight:700;font-size:15px;margin-bottom:12px"></div>
    <button class="photo-btn" id="photoPickBtn">📷 Fotoğraf Çek / Seç</button>
    <img id="photoPreview" alt="önizleme">
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
    <label style="margin-top:10px">Not (opsiyonel)</label>
    <textarea id="csNote" placeholder="örn. sokak başından sona süpürüldü"></textarea>
    <div class="row">
      <button id="csCancelBtn">Vazgeç</button>
      <button class="primary" id="csSaveBtn" disabled>✅ Kapat & Gönder</button>
    </div>
  </div>
</div>

<!-- ── Bildirim gider modal ── -->
<div class="modal-overlay hidden" id="resolveNotifModal">
  <div class="modal">
    <h2 id="resolveNotifTitle">✅ Bildirimi Gider</h2>
    <input type="hidden" id="resolveNotifId">
    <div id="resolveNotifStreet" style="font-size:13px;font-weight:600;margin-bottom:10px"></div>
    <label>Not (isteğe bağlı)</label>
    <textarea id="resolveNotifNote" placeholder="Ne yapıldı? Nasıl giderildi?"></textarea>
    <button class="photo-btn" id="resolvePhotoBtn">📷 Fotoğraf Çek / Seç (isteğe bağlı)</button>
    <img id="resolvePhotoPreview" alt="önizleme" style="width:100%;border-radius:8px;margin-top:8px;display:none">
    <input type="file" id="resolvePhotoInput" accept="image/*" capture="environment" style="display:none">
    <div class="row">
      <button id="resolveNotifCancelBtn">Vazgeç</button>
      <button class="primary" id="resolveNotifSaveBtn">✅ Giderildi Kaydet</button>
    </div>
  </div>
</div>

<!-- ── Bildirim ekle modal ── -->
<div class="modal-overlay hidden" id="addNotifModal">
  <div class="modal">
    <h2>⚠️ Olumsuzluk Bildir</h2>
    <label>Tür</label>
    <select id="notifType">
      {% for key, (icon, label, _) in notification_types.items() %}
      <option value="{{ key }}">{{ icon }} {{ label }}</option>
      {% endfor %}
    </select>
    <label>Not (opsiyonel, sesli not için aşağıdaki butonu kullan)</label>
    <textarea id="notifNote" placeholder="Kısa açıklama…"></textarea>
    <div style="color:var(--muted);font-size:12px;margin-top:6px" id="notifLocInfo">📍 Konum: GPS bekleniyor…</div>
    <div class="row">
      <button id="notifCancelBtn">Vazgeç</button>
      <button class="primary" id="notifSaveBtn">Gönder</button>
    </div>
  </div>
</div>

<!-- ── Sağ panel: sokak listesi / bildirim havuzu ── -->
<div id="sidePanel">
  <div id="sidePanelHeader">
    <h2 id="sidePanelTitle">Sokaklar</h2>
    <button class="iconbtn" id="sidePanelCloseBtn">✕</button>
  </div>
  <div id="sidePanelBody"></div>
</div>

<!-- ── Çavuş: güzergah atama modal ── -->
<div class="modal-overlay hidden" id="assignModal">
  <div class="modal">
    <h2>📋 Güzergah Ata</h2>
    <div class="assign-form">
      <label>Ekip Türü</label>
      <select id="assignTeamType">
        {% for key, label in roles.items() %}
        {% if key not in ('santiye_amiri', 'cavus', 'onbasi') %}
        <option value="{{ key }}">{{ label }}</option>
        {% endif %}
        {% endfor %}
      </select>
      <div class="checkrow" style="margin-top:10px">
        <input type="checkbox" id="assignPermanent">
        <label for="assignPermanent">Kalıcı Atama (silinene kadar geçerli)</label>
      </div>
      <div id="assignDateSection">
        <label>Tarih</label>
        <input type="date" id="assignDate" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px">
      </div>
      <label>Vardiya</label>
      <select id="assignShift"><option value="">— Tüm gün —</option></select>
      <label>Kişi (opsiyonel)</label>
      <select id="assignUser"><option value="">— Tüm ekip —</option></select>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:12px">Sokakları haritadan tıklayarak veya listeden işaretleyerek seçin.</p>
    <div class="row" style="margin-top:10px">
      <button id="assignCancelBtn">Vazgeç</button>
      <button id="assignMapBtn" style="background:var(--blue);border-color:var(--blue);color:#fff">🗺️ Haritadan</button>
      <button class="primary" id="assignListBtn">📋 Listeden</button>
    </div>
  </div>
</div>

<!-- ── Atama seçim çubuğu (modal kapanınca haritanın üstünde kalır) ── -->
<!-- ── Sokak detay modal ── -->
<div class="modal-overlay hidden" id="streetDetailModal">
  <div class="modal">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <h2 style="margin:0;flex:1;font-size:14px" id="sdStreetName">Sokak</h2>
      <button class="iconbtn" id="sdCloseBtn">✕</button>
    </div>
    <div id="sdBody"></div>
    <div id="sdActions" style="display:flex;gap:8px;margin-top:12px"></div>
  </div>
</div>

<!-- ── Personel listesi modal ── -->
<div class="modal-overlay hidden" id="personnelModal">
  <div class="modal">
    <h2>👥 Personel Yönetimi</h2>
    <button id="addPersonnelBtn" style="width:100%;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--green);background:var(--green);color:#fff;font-size:13px;font-weight:600;margin-bottom:12px">+ Yeni Personel Ekle</button>
    <div id="personnelList"><p style="color:var(--muted);font-size:13px">Yükleniyor…</p></div>
    <div class="row" style="margin-top:12px">
      <button id="personnelCloseBtn">Kapat</button>
    </div>
  </div>
</div>

<!-- ── Personel ekle / düzenle modal ── -->
<div class="modal-overlay hidden" id="editPersonnelModal">
  <div class="modal">
    <h2 id="editPersonnelTitle">👤 Personel Ekle</h2>
    <input type="hidden" id="epUserId">
    <label>Ad Soyad</label>
    <input type="text" id="epDisplayName" placeholder="Mehmet Yılmaz" autocomplete="off">
    <div id="epUsernameSection">
      <label>Kullanıcı Adı</label>
      <input type="text" id="epUsername" placeholder="mehmet.yilmaz" autocomplete="off">
    </div>
    <label>Şifre <span id="epPasswordHint" style="color:var(--muted);font-weight:400;font-size:12px"></span></label>
    <input type="text" id="epPassword" placeholder="Şifre…" autocomplete="new-password">
    <label>Rol</label>
    <select id="epRole">
      {% for key, label in roles.items() %}
      <option value="{{ key }}">{{ label }}</option>
      {% endfor %}
    </select>
    <label>Varsayılan Vardiya</label>
    <select id="epShift">
      <option value="">— Seçmek zorunda değilsiniz —</option>
    </select>
    <div class="checkrow" style="margin-top:12px">
      <input type="checkbox" id="epIsActive" checked>
      <label for="epIsActive">Aktif kullanıcı</label>
    </div>
    <div class="checkrow" id="epNotifSweepRow" style="margin-top:8px;display:none">
      <input type="checkbox" id="epNotifSweep" checked>
      <label for="epNotifSweep">Süpürme bildirimlerini al (Telegram)</label>
    </div>
    <div class="row">
      <button id="epCancelBtn">Vazgeç</button>
      <button class="primary" id="epSaveBtn">Kaydet</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
