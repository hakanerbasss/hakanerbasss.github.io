<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kaba Atık Rota</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a7a3c">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="iconbtn" id="menuBtn">☰</button>
    <div id="progressWrap">
      <div class="title" id="neighborhoodTitle">Mahalle seçilmedi</div>
      <div id="progressBar"><div id="progressFill"></div></div>
      <div id="progressLabel">0 / 0 sokak gezildi</div>
    </div>
    <button class="iconbtn" id="voiceToggleBtn" title="Sesli yönlendirme aç/kapat">🔊</button>
  </div>

  <div id="map"></div>

  <div id="bottombar">
    <button id="addPointBtn" class="primary">📍 Nokta Ekle</button>
    <button id="routeBtn">🧭 Girilmeyen Sokaklar</button>
    <button id="finishBtn" class="finish">✅ Bitti</button>
  </div>
</div>

<div id="sidePanel">
  <h2>Girilmeyen Sokaklar</h2>
  <div id="streetList"></div>
</div>

<div class="modal-overlay hidden" id="pointModalOverlay">
  <div class="modal">
    <h2>Yeni Nokta / Not</h2>
    <select id="pointType">
      {% for key, label in point_types.items() %}
      <option value="{{ key }}">{{ label }}</option>
      {% endfor %}
    </select>
    <textarea id="pointNote" placeholder="Not (opsiyonel) — örn. Barış Sokak 3 nolu konteyner dolu"></textarea>
    <label class="checkline"><input type="checkbox" id="pointNotify" checked> Yetkiliye Telegram'dan gönder</label>
    <div class="row">
      <button id="pointCancelBtn">Vazgeç</button>
      <button class="primary" id="pointSaveBtn">Kaydet</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="menuModalOverlay">
  <div class="modal">
    <h2>Mahalle Seç / Ekle</h2>
    <textarea id="neighborhoodInput" placeholder="Örn: Gümüşpala Mahallesi, Avcılar, İstanbul" style="min-height:40px;"></textarea>
    <div class="row">
      <button id="menuCancelBtn">Vazgeç</button>
      <button class="primary" id="neighborhoodLoadBtn">Yükle</button>
    </div>
    <div id="neighborhoodListWrap" style="margin-top:14px;"></div>
    <div class="row" style="margin-top:14px;">
      <button id="logoutBtn">Çıkış Yap ({{ user }})</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
