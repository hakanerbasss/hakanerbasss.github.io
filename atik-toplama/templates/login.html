<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Belediye Saha Yönetimi</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1a7a3c">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d1117;color:#e6edf3;font-family:-apple-system,system-ui,'Segoe UI',sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:32px 24px;width:100%;max-width:360px}
h1{font-size:20px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sub{color:#8b949e;font-size:13px;margin-bottom:24px}
input{width:100%;padding:12px 14px;margin-bottom:12px;background:#0d1117;border:1px solid #30363d;border-radius:10px;color:#e6edf3;font-size:16px}
input:focus{outline:none;border-color:#1a7a3c}
button{width:100%;padding:13px;background:#1a7a3c;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:active{opacity:.85}
.err{color:#f85149;font-size:13px;margin-top:8px;min-height:18px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>🏙️ Saha Yönetim</h1>
  <p class="sub">Belediye temizlik operasyonu</p>
  <form id="frm">
    <input id="usr" type="text" placeholder="Kullanıcı adı" autocomplete="username" required>
    <input id="pw"  type="password" placeholder="Şifre" autocomplete="current-password" required>
    <button type="submit">Giriş Yap</button>
    <div id="err" class="err"></div>
  </form>
</div>
<script>
document.getElementById('frm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: document.getElementById('usr').value.trim(), password: document.getElementById('pw').value})
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error || 'Giriş başarısız'; return; }
    location.href = '/';
  } catch { err.textContent = 'Bağlantı hatası'; }
});
</script>
</body>
</html>
