# /etc/nginx/sites-available/sitebot  →  kur.wizaicorp.com
# Sunucudaki diger servislere dokunmaz; yalnizca bu subdomain'i 8003'e yonlendirir.
server {
    listen 80;
    listen [::]:80;
    server_name kur.wizaicorp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kur.wizaicorp.com;

    # certbot --nginx -d kur.wizaicorp.com  bu satirlari kendisi doldurur
    ssl_certificate     /etc/letsencrypt/live/kur.wizaicorp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kur.wizaicorp.com/privkey.pem;

    # musteri gorselleri buradan geciyor
    client_max_body_size 16m;

    location / {
        proxy_pass         http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
