# InsTube (instube.service) — port 8002
#
# Ayrı subdomain, ayrı servis (bkz. CLAUDE.md → "InsTube"). YouTube OAuth
# callback URI'leri bu domaine göre kayıtlı:
#   https://__PANEL_DOMAIN__/auth/youtube/callback      (TR)
#   https://__PANEL_DOMAIN__/auth/youtube/en/callback   (EN)
# Domain değişirse Google Cloud Console'daki izinli URI'ler de güncellenmeli,
# yoksa kanal yetkilendirme adımı redirect_uri_mismatch ile reddedilir.
#
# __PANEL_DOMAIN__ yer tutucusunu bootstrap.sh dolduruyor.

server {
    listen 80;
    listen [::]:80;
    server_name __PANEL_DOMAIN__;

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
        proxy_buffering off;
    }
}
