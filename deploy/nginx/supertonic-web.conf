# supertonic-web (tts.service) — port 8001
#
# Tek servis iki işi birden görüyor: bot paneli VE haber sitesi. Ayrım
# app.py'deki auth_middleware'de Host başlığına göre yapılıyor
# (news_site.NEWS_DOMAIN / NEWS_LEGACY_HOSTS), bu yüzden nginx'in yapması
# gereken tek şey Host'u olduğu gibi geçirmek — ayrı bir server bloğu gerekmez.
#
# default_server: IP ile (http://SUNUCU_IP/) doğrudan panele girilebilsin diye.
# DNS henüz yeni sunucuya taşınmamışken kurulumu doğrulamanın tek yolu bu.
#
# __MAIN_DOMAIN__ / __NEWS_DOMAIN__ yer tutucularını bootstrap.sh dolduruyor.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __MAIN_DOMAIN__ __NEWS_DOMAIN__ _;

    # Video yükleme/indirme var — varsayılan 1M çok küçük.
    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Video üretimi (DeepSeek + TTS + ffmpeg) dakikalarca sürebiliyor;
        # 60sn'lik varsayılan timeout üretimi yarıda "504" ile kesiyordu.
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        # Uzun süren üretim isteklerinde yanıtı diske tamponlamasın.
        proxy_buffering off;
    }
}
