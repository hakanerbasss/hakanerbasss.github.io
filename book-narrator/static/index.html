<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Narrator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="header">
  <div class="header-logo">🎧</div>
  <h1>Book Narrator</h1>
  <div class="header-sub">Supertonic TTS · PDF / EPUB / TXT / DOCX</div>
</header>

<main class="layout">

  <!-- API Ayarları -->
  <div class="card">
    <div class="card-title">
      <span>API Ayarları</span>
      <span id="settingsStatus" class="settings-status"></span>
    </div>
    <div class="settings-grid">
      <div class="field">
        <label>DeepSeek API Key <span class="feat-tag">Çeviri · Metadata</span></label>
        <input type="password" id="deepseekKey" placeholder="sk-..." autocomplete="off">
      </div>
      <div class="field">
        <label>Pexels API Key <span class="feat-tag">Görseller · MP4 Video</span></label>
        <input type="password" id="pexelsKey" placeholder="Pexels API key..." autocomplete="off">
      </div>
    </div>
    <div class="settings-footer">
      <div class="settings-info">
        <span id="dsStatus" class="api-dot dot-off">●</span> DeepSeek
        <span id="pxStatus" class="api-dot dot-off" style="margin-left:12px">●</span> Pexels
      </div>
      <button class="btn btn-ghost btn-sm" onclick="saveSettings()">💾 Kaydet</button>
    </div>
  </div>

  <!-- Ses Seçimi -->
  <div class="card">
    <div class="card-title">Ses Seçimi & Önizleme</div>
    <div class="voice-row">
      <div class="voice-group">
        <label>Seslendirici</label>
        <select id="voiceSelect" onchange="onVoiceChange()">
          <option value="">Yükleniyor...</option>
        </select>
      </div>
      <button class="btn btn-ghost" id="btnPreview" onclick="previewVoice()" style="height:42px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Önizle (~10 sn)
      </button>
    </div>
    <div class="preview-wrap" id="previewWrap" style="display:none">
      <audio id="previewAudio" controls></audio>
    </div>
  </div>

  <!-- Kitap Yükleme -->
  <div class="card">
    <div class="card-title">Kitap Yükle</div>
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="dz-icon">📖</div>
      <div class="dz-label">Dosyayı buraya sürükle veya tıkla</div>
      <div class="dz-sub">Telif hakkı olmayan / public domain kitaplar</div>
      <div class="dz-formats">
        <span class="fmt-tag">PDF</span>
        <span class="fmt-tag">EPUB</span>
        <span class="fmt-tag">TXT</span>
        <span class="fmt-tag">DOCX</span>
      </div>
      <div class="file-selected" id="fileSelectedLabel" style="display:none"></div>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.epub,.txt,.docx" onchange="onFileSelect(this)">

    <div class="lang-row">
      <div class="field">
        <label>Kitap Dili (kaynak)</label>
        <select id="sourceLang" onchange="onLangChange()">
          <option value="auto">Otomatik (çeviri yok)</option>
        </select>
      </div>
      <div class="lang-arrow">→</div>
      <div class="field">
        <label>Seslendirme Dili (hedef)</label>
        <select id="targetLang" onchange="onLangChange()">
          <option value="tr">Türkçe</option>
        </select>
      </div>
    </div>
    <div class="lang-note" id="langNote" style="display:none"></div>

    <div class="form-row">
      <div class="field">
        <label>Kitap Adı (opsiyonel)</label>
        <input type="text" id="titleInput" placeholder="Boş bırakılırsa dosya adından alınır">
      </div>
      <button class="btn btn-primary" id="btnUpload" onclick="uploadBook()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Seslendir
      </button>
    </div>
  </div>

  <!-- Üretim Listesi -->
  <div class="card">
    <div class="card-title">
      <span>Sesli Kitaplar</span>
      <button class="btn btn-ghost btn-xs" onclick="loadJobs()">↻ Yenile</button>
    </div>
    <div id="jobList">
      <div class="empty">
        <div class="empty-icon">🎙️</div>
        <div class="empty-title">Henüz sesli kitap yok</div>
        <div>Kitap yükleyerek başlayın</div>
      </div>
    </div>
  </div>

</main>
<script src="/static/app.js"></script>
</body>
</html>
