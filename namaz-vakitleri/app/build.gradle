plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.hakanerbas.namaz'
    compileSdk 35

    defaultConfig {
        applicationId "com.hakanerbas.namaz"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions { kotlinCompilerExtensionVersion '1.5.5' }
    kotlinOptions { jvmTarget = '17' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 16kb page alignment fix (Android 15 / Play Store zorunluluğu)
    packaging {
        jniLibs { useLegacyPackaging = false }
    }
}

// 16kb: graphics-path 1.0.1 → 4KB hizali, force ile 1.1.0-rc01 kullan
configurations.all {
    resolutionStrategy {
        force 'androidx.graphics:graphics-path:1.1.0-rc01'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.core:core-ktx:1.12.0'

    // Firebase (FCM bildirimleri) — BOM 33.7.0+
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // AdMob — 23.3.0 kullan (23.6+ kotlin-stdlib-2.1.x ceker, 1.9.x ile catisir)
    implementation 'com.google.android.gms:play-services-ads:23.3.0'

    // UMP — kullanici rizasi (No Fill sorununu onler)
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'

    // HTTP + JSON
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
}
