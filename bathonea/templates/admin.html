<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yönetim — Bathonea</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand">⚙️ Bathonea Yönetim</div>
    <button class="iconbtn" id="logoutBtn">Çıkış</button>
  </div>

  <div class="container">

    <div class="section">
      <h2>🔑 DeepSeek Ayarları</h2>
      <div class="field">
        <label>API Anahtarı <span id="keyStatus" style="color:var(--muted)"></span></label>
        <input type="password" id="apiKey" placeholder="sk-...">
      </div>
      <div class="field">
        <label>Model</label>
        <input type="text" id="modelName" placeholder="deepseek-chat">
      </div>
      <button class="btn primary" id="saveSettingsBtn">Kaydet</button>
    </div>

    <div class="section">
      <h2>📤 Yeni Sözleşme / Güncelleme Yükle (PDF)</h2>
      <div class="field">
        <label>Belge Adı</label>
        <input type="text" id="uploadTitle" placeholder="örn. Toplu İş Sözleşmesi 2025-2028">
      </div>
      <div class="field">
        <label>PDF Dosyası</label>
        <input type="file" id="uploadFile" accept="application/pdf">
      </div>
      <button class="btn primary" id="uploadBtn">Yükle ve İşle</button>
      <div id="uploadStatus" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
    </div>

    <div class="section">
      <h2>📚 Belgeler</h2>
      <div id="docList"><p style="color:var(--muted);font-size:13px">Yükleniyor…</p></div>
    </div>

    <div class="section" id="pagesSection" style="display:none">
      <h2>📄 Sayfalar — <span id="pagesDocTitle"></span></h2>
      <div class="field">
        <label>Tek Sayfa Görsel Ekle</label>
        <input type="file" id="addPageFile" accept="image/*">
        <button class="btn" id="addPageBtn" style="margin-top:8px">+ Sayfa Ekle</button>
      </div>
      <div id="pagesList"></div>
    </div>

  </div>
</div>

<script src="/static/js/admin.js"></script>
</body>
</html>
