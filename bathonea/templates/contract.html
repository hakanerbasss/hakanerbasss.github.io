<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sözleşmeyi Oku — Bathonea</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="iconbtn" href="/">←</a>
    <div class="brand">📖 Sözleşmeyi Oku</div>
    <a class="iconbtn" href="/sohbet">💬</a>
  </div>

  <div class="contract-search">
    <input type="text" id="searchInput" placeholder="Madde veya kelime ara…">
  </div>

  <div class="container" id="pagesContainer">
    <div class="empty-state">Yükleniyor…</div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js', {scope: '/'}).catch(() => {});
}

let ALL_PAGES = [];

function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, q) {
  if (!q) return esc(text);
  const escaped = esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return escaped.replace(re, '<mark>$1</mark>');
}

function render(query) {
  const c = document.getElementById('pagesContainer');
  if (!ALL_PAGES.length) {
    c.innerHTML = '<div class="empty-state">Henüz bir sözleşme belgesi yüklenmemiş.</div>';
    return;
  }
  const q = (query || '').trim();
  const filtered = q
    ? ALL_PAGES.filter(p => (p.text || '').toLowerCase().includes(q.toLowerCase()))
    : ALL_PAGES;
  if (!filtered.length) {
    c.innerHTML = '<div class="empty-state">Sonuç bulunamadı.</div>';
    return;
  }
  c.innerHTML = filtered.map(p => `
    <div class="page-card">
      <div class="pnum">SAYFA ${p.page_number}</div>
      <div class="ptext">${highlight(p.text || '(metin yok)', q)}</div>
    </div>
  `).join('');
}

async function load() {
  try {
    const res = await fetch('/api/document');
    const data = await res.json();
    ALL_PAGES = data.pages || [];
    render('');
  } catch (e) {
    document.getElementById('pagesContainer').innerHTML =
      '<div class="empty-state">Yüklenirken hata oluştu.</div>';
  }
}

document.getElementById('searchInput').addEventListener('input', e => render(e.target.value));
load();
</script>
</body>
</html>
