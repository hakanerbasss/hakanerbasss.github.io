<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yönetim Girişi — Bathonea</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-box">
  <h1>🔐 Yönetim Girişi</h1>
  <div class="field">
    <label>Kullanıcı Adı</label>
    <input type="text" id="username" autocomplete="username">
  </div>
  <div class="field">
    <label>Şifre</label>
    <input type="password" id="password" autocomplete="current-password">
  </div>
  <button class="btn primary" id="loginBtn" style="width:100%">Giriş Yap</button>
  <div id="err" style="color:var(--red);font-size:12px;margin-top:10px;text-align:center"></div>
</div>

<script>
async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || 'Giriş başarısız'; return; }
    location.href = '/admin';
  } catch (e) { err.textContent = 'Bağlantı hatası'; }
}
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
