android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.daemon=false
# AGP 8.5.1 compileSdk 36'yi resmi olarak "desteklenmiyor" diye isaretleyebilir -
# platform SDK kurulup calisiyor oldugu surece bu satir sert hataya donusmesini engeller
android.suppressUnsupportedCompileSdk=36
