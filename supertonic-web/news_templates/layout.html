<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Hakan Erbaş | Güncel Haberler{% endblock %}</title>
<meta name="description" content="Türkiye ve dünyadan seni doğrudan ilgilendiren güncel haberler, günlük kısa videolarla.">
<style>
  :root{
    --red:#d5000a; --ink:#14151a; --sub:#6b7280; --line:#e8e9ec; --bg:#f6f7f9;
    --card:#ffffff; --yellow:#ffd000;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  header.site{
    background:var(--card); border-bottom:3px solid var(--red);
    position:sticky; top:0; z-index:10;
  }
  .header-inner{
    max-width:1080px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .mark{
    background:var(--red); color:#fff; font-weight:800; font-size:13px;
    padding:3px 8px; border-radius:4px; letter-spacing:.5px;
  }
  .brand .name{ font-weight:800; font-size:20px; letter-spacing:-.2px; }
  .brand .name span{ color:var(--red); }
  nav.top a{
    font-size:14px; font-weight:600; color:var(--sub); margin-left:22px;
  }
  nav.top a:hover{ color:var(--ink); }
  main{ max-width:1080px; margin:0 auto; padding:24px 20px 60px; }
  footer{
    border-top:1px solid var(--line); margin-top:40px; padding:26px 20px;
    text-align:center; color:var(--sub); font-size:13px;
  }
  footer a{ color:var(--red); font-weight:600; }

  .badge{
    display:inline-block; font-size:11px; font-weight:800; letter-spacing:.4px;
    color:#fff; padding:3px 9px; border-radius:4px; text-transform:uppercase;
  }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:20px; margin-top:18px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; transition:box-shadow .15s, transform .15s;
  }
  .card:hover{ box-shadow:0 10px 24px rgba(20,21,26,.08); transform:translateY(-2px); }
  .card .thumb{
    width:100%; aspect-ratio:9/13; object-fit:cover; background:#eee; display:block;
  }
  .card .body{ padding:12px 14px 16px; }
  .card .badge{ margin-bottom:8px; }
  .card h3{ font-size:15px; line-height:1.35; margin:0 0 6px; }
  .card .meta{ font-size:12px; color:var(--sub); }

  .pager{ display:flex; justify-content:center; gap:8px; margin-top:32px; }
  .pager a, .pager span{
    padding:8px 14px; border-radius:8px; border:1px solid var(--line);
    font-size:13px; font-weight:600; background:var(--card);
  }
  .pager .active{ background:var(--red); color:#fff; border-color:var(--red); }

  .empty{ text-align:center; padding:60px 20px; color:var(--sub); }
</style>
</head>
<body>
<header class="site">
  <div class="header-inner">
    <a class="brand" href="/haberler">
      <span class="mark">SON DAKİKA</span>
      <span class="name">Hakan <span>Erbaş</span></span>
    </a>
    <nav class="top">
      <a href="/haberler">Haberler</a>
    </nav>
  </div>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>
  Bu içerikler yapay zeka destekli olarak üretilmiştir. &middot;
  <a href="https://www.instagram.com/hakanerbasss" target="_blank" rel="noopener">Instagram'da takip et</a>
</footer>
</body>
</html>
