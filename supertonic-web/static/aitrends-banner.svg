<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <!-- Arka plan gradyanı -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#06060f"/>
      <stop offset="50%"  stop-color="#0d0d1e"/>
      <stop offset="100%" stop-color="#06060f"/>
    </linearGradient>

    <!-- Mor ışıma merkezi -->
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- "ai" metin gradyanı -->
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Parlama filtresi -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Nokta desen -->
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="1.2" fill="#ffffff" opacity="0.055"/>
    </pattern>

    <!-- Sol soluk için maske -->
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── Arka plan ── -->
  <rect width="2560" height="1440" fill="url(#bgGrad)"/>
  <rect width="2560" height="1440" fill="url(#dots)"/>

  <!-- Mor merkez parlaması -->
  <ellipse cx="1280" cy="720" rx="860" ry="420" fill="url(#purpleGlow)"/>

  <!-- ── Yatay süsleme çizgileri ── -->
  <rect x="0"    y="500" width="2560" height="1" fill="#7c3aed" opacity="0.10"/>
  <rect x="0"    y="940" width="2560" height="1" fill="#7c3aed" opacity="0.10"/>

  <!-- Sol yatay hat + elmas -->
  <rect x="220" y="719" width="620" height="2" fill="url(#fadeLeft)"/>
  <rect x="220" y="717" width="440" height="1" fill="#7c3aed" opacity="0.12"/>
  <polygon points="847,720 835,709 823,720 835,731" fill="#7c3aed" opacity="0.55"/>

  <!-- Sağ yatay hat + elmas -->
  <rect x="1713" y="719" width="620" height="2" fill="url(#fadeRight)"/>
  <rect x="1893" y="717" width="440" height="1" fill="#7c3aed" opacity="0.12"/>
  <polygon points="1713,720 1725,709 1737,720 1725,731" fill="#7c3aed" opacity="0.55"/>

  <!-- Sol dikey bar grubu -->
  <rect x="185" y="566" width="4" height="308" fill="#7c3aed" opacity="0.45" rx="2"/>
  <rect x="202" y="610" width="2.5" height="220" fill="#7c3aed" opacity="0.25" rx="1"/>
  <rect x="215" y="648" width="2" height="144" fill="#7c3aed" opacity="0.14" rx="1"/>

  <!-- Sağ dikey bar grubu -->
  <rect x="2371" y="566" width="4" height="308" fill="#7c3aed" opacity="0.45" rx="2"/>
  <rect x="2355" y="610" width="2.5" height="220" fill="#7c3aed" opacity="0.25" rx="1"/>
  <rect x="2343" y="648" width="2" height="144" fill="#7c3aed" opacity="0.14" rx="1"/>

  <!-- ── Köşe parantezleri ── -->
  <path d="M90,90 L90,210 M90,90 L210,90"   stroke="#7c3aed" stroke-width="2.5" fill="none" opacity="0.28"/>
  <path d="M2470,90 L2470,210 M2470,90 L2350,90" stroke="#7c3aed" stroke-width="2.5" fill="none" opacity="0.28"/>
  <path d="M90,1350 L90,1230 M90,1350 L210,1350"  stroke="#7c3aed" stroke-width="2.5" fill="none" opacity="0.28"/>
  <path d="M2470,1350 L2470,1230 M2470,1350 L2350,1350" stroke="#7c3aed" stroke-width="2.5" fill="none" opacity="0.28"/>

  <!-- ── Ana logo: "aiNews" ── -->
  <!-- "ai" kısmı: mor gradyan + parlama -->
  <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="300" font-weight="900"
        text-anchor="middle" x="1280" y="790"
        letter-spacing="-6">
    <tspan fill="url(#aiGrad)" filter="url(#glow)">ai</tspan><tspan fill="#f1f5f9">Trends</tspan>
  </text>

  <!-- ── Alt yazı ── -->
  <text x="1280" y="888"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="38" font-weight="300"
        text-anchor="middle" fill="#64748b" letter-spacing="16">
    GÜNCEL HABERLER  ·  YAPAY ZEKA
  </text>

  <!-- Alt çizgi -->
  <rect x="1190" y="912" width="180" height="2" fill="url(#aiGrad)" rx="1" opacity="0.75"/>

  <!-- Küçük © etiket -->
  <text x="2100" y="590"
        font-family="monospace" font-size="20"
        fill="#7c3aed" opacity="0.35" letter-spacing="2">© aiTrends</text>
</svg>
