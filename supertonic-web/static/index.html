<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supertonic TTS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    min-height: 100vh;
  }

  header {
    padding: 24px 32px;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 { font-size: 20px; font-weight: 600; color: #fff; }
  header span { font-size: 12px; color: #666; }

  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid #222;
    padding: 0 32px;
  }

  .tab {
    padding: 14px 24px;
    cursor: pointer;
    font-size: 14px;
    color: #666;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }

  .tab.active { color: #fff; border-bottom-color: #7c3aed; }
  .tab:hover { color: #ccc; }

  .panel { display: none; padding: 32px; max-width: 800px; }
  .panel.active { display: block; }

  .field { margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: #888; margin-bottom: 8px; }

  textarea, select, input[type="range"] {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 14px;
    padding: 12px;
    outline: none;
    transition: border-color 0.15s;
  }

  textarea:focus, select:focus { border-color: #7c3aed; }
  textarea { resize: vertical; min-height: 140px; }

  select { padding: 10px 12px; cursor: pointer; }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }

  .speed-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .speed-row input { flex: 1; accent-color: #7c3aed; }
  .speed-val { font-size: 13px; color: #888; min-width: 36px; }

  button {
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  button:hover { background: #6d28d9; }
  button:disabled { background: #333; color: #555; cursor: not-allowed; }

  .result {
    margin-top: 24px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 20px;
    display: none;
  }

  .result.show { display: block; }
  .result audio, .result video { width: 100%; margin-top: 12px; border-radius: 6px; }
  .result video { max-height: 360px; }

  .result p { font-size: 13px; color: #888; margin-bottom: 8px; }
  .result .transcript {
    font-size: 14px; color: #ccc; line-height: 1.6;
    background: #111; padding: 12px; border-radius: 6px; margin-top: 8px;
  }

  .upload-area {
    border: 2px dashed #2a2a2a;
    border-radius: 10px;
    padding: 40px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .upload-area:hover, .upload-area.drag { border-color: #7c3aed; }
  .upload-area p { color: #555; font-size: 14px; margin-top: 8px; }
  .upload-area strong { color: #888; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid #ffffff44;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    background: #1f0a0a;
    border: 1px solid #5a1a1a;
    color: #f87171;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 16px;
    display: none;
  }

  .translate-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    align-items: end;
    margin-bottom: 20px;
  }

  .translate-row .arrow {
    color: #555; font-size: 20px; padding-bottom: 10px; text-align: center;
  }

  .filename-badge {
    display: inline-block;
    background: #1f1433;
    color: #a78bfa;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>Supertonic TTS</h1>
  <span>yerel · hızlı · çok dilli</span>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('text')">Metin → Ses</div>
  <div class="tab" onclick="switchTab('video')">Video Seslendirme</div>
  <div class="tab" onclick="switchTab('translate')">Çeviri + Seslendir</div>
</div>

<!-- TEXT TO SPEECH -->
<div class="panel active" id="tab-text">
  <div class="field">
    <label>Metin</label>
    <textarea id="tts-text" placeholder="Seslendirilecek metni girin...&#10;&#10;&lt;laugh&gt; gülen ses&#10;&lt;breath&gt; nefes&#10;&lt;sigh&gt; iç çekme"></textarea>
  </div>

  <div class="controls">
    <div class="field">
      <label>Dil</label>
      <select id="tts-lang"></select>
    </div>
    <div class="field">
      <label>Ses</label>
      <select id="tts-voice"></select>
    </div>
    <div class="field">
      <label>Hız: <span id="speed-val-1">1.0</span>x</label>
      <div class="speed-row">
        <input type="range" id="tts-speed" min="0.5" max="2.0" step="0.05" value="1.0"
          oninput="document.getElementById('speed-val-1').textContent = parseFloat(this.value).toFixed(2)">
      </div>
    </div>
  </div>

  <button onclick="synthesize()" id="btn-synth">
    <div class="spinner" id="spin-synth"></div>
    Seslendir
  </button>

  <div class="error" id="err-synth"></div>

  <div class="result" id="result-synth">
    <p>Oluşturulan ses</p>
    <audio id="audio-synth" controls></audio>
  </div>
</div>

<!-- VIDEO VOICING -->
<div class="panel" id="tab-video">
  <div class="field">
    <label>Video Yükle</label>
    <div class="upload-area" id="drop-zone" onclick="document.getElementById('video-file').click()"
      ondragover="event.preventDefault();this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')"
      ondrop="handleDrop(event)">
      <strong>Tıkla veya sürükle bırak</strong>
      <p>MP4, MOV, AVI, MKV, WEBM</p>
      <div id="file-badge"></div>
    </div>
    <input type="file" id="video-file" accept="video/*" style="display:none" onchange="showFilename(this)">
  </div>

  <div class="controls">
    <div class="field">
      <label>Hedef Dil</label>
      <select id="vid-lang"></select>
    </div>
    <div class="field">
      <label>Ses</label>
      <select id="vid-voice"></select>
    </div>
    <div class="field">
      <label>Hız: <span id="speed-val-2">1.0</span>x</label>
      <div class="speed-row">
        <input type="range" id="vid-speed" min="0.5" max="2.0" step="0.05" value="1.0"
          oninput="document.getElementById('speed-val-2').textContent = parseFloat(this.value).toFixed(2)">
      </div>
    </div>
  </div>

  <div class="field">
    <label>Çeviri (opsiyonel — boş bırakırsan orijinal dilde seslendirir)</label>
    <select id="vid-translate">
      <option value="">Çeviri yapma</option>
    </select>
  </div>

  <button onclick="voiceVideo()" id="btn-video">
    <div class="spinner" id="spin-video"></div>
    Seslendir
  </button>

  <div class="error" id="err-video"></div>

  <div class="result" id="result-video">
    <p>Transkript</p>
    <div class="transcript" id="video-transcript"></div>
    <p style="margin-top:16px">Seslendirilmiş Video</p>
    <video id="video-out" controls></video>
  </div>
</div>

<!-- TRANSLATE + TTS -->
<div class="panel" id="tab-translate">
  <div class="field">
    <label>Kaynak Metin</label>
    <textarea id="tr-text" placeholder="Çevrilecek metni girin..."></textarea>
  </div>

  <div class="translate-row">
    <div class="field">
      <label>Kaynak Dil</label>
      <select id="tr-source">
        <option value="auto">Otomatik Algıla</option>
      </select>
    </div>
    <div class="arrow">→</div>
    <div class="field">
      <label>Hedef Dil</label>
      <select id="tr-target"></select>
    </div>
  </div>

  <div class="controls">
    <div class="field">
      <label>Ses</label>
      <select id="tr-voice"></select>
    </div>
    <div class="field" style="grid-column: span 2">
      <label>Hız: <span id="speed-val-3">1.0</span>x</label>
      <div class="speed-row">
        <input type="range" id="tr-speed" min="0.5" max="2.0" step="0.05" value="1.0"
          oninput="document.getElementById('speed-val-3').textContent = parseFloat(this.value).toFixed(2)">
      </div>
    </div>
  </div>

  <button onclick="translateAndSynth()" id="btn-tr">
    <div class="spinner" id="spin-tr"></div>
    Çevir ve Seslendir
  </button>

  <div class="error" id="err-tr"></div>

  <div class="result" id="result-tr">
    <p>Çeviri</p>
    <div class="transcript" id="tr-translated"></div>
    <p style="margin-top:16px">Oluşturulan ses</p>
    <audio id="audio-tr" controls></audio>
  </div>
</div>

<script>
let voices = [], langs = {};

async function loadMeta() {
  const r = await fetch('/api/voices');
  const d = await r.json();
  voices = d.voices;
  langs = d.languages;

  const voiceSelects = ['tts-voice', 'vid-voice', 'tr-voice'];
  const langSelects = ['tts-lang', 'vid-lang', 'tr-target'];
  const translateSelect = document.getElementById('vid-translate');
  const sourceSelect = document.getElementById('tr-source');

  voiceSelects.forEach(id => {
    const el = document.getElementById(id);
    voices.forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      el.appendChild(o);
    });
  });

  langSelects.forEach(id => {
    const el = document.getElementById(id);
    Object.entries(langs).forEach(([code, name]) => {
      const o = document.createElement('option');
      o.value = code; o.textContent = name;
      if (code === 'tr') o.selected = true;
      el.appendChild(o);
    });
  });

  Object.entries(langs).forEach(([code, name]) => {
    const o1 = document.createElement('option');
    o1.value = code; o1.textContent = name;
    translateSelect.appendChild(o1);

    const o2 = document.createElement('option');
    o2.value = code; o2.textContent = name;
    sourceSelect.appendChild(o2);
  });
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['text','video','translate'][i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

function setLoading(btnId, spinId, loading) {
  const btn = document.getElementById(btnId);
  const spin = document.getElementById(spinId);
  btn.disabled = loading;
  spin.style.display = loading ? 'block' : 'none';
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

async function synthesize() {
  const text = document.getElementById('tts-text').value.trim();
  if (!text) return showError('err-synth', 'Metin boş olamaz.');
  showError('err-synth', '');
  setLoading('btn-synth', 'spin-synth', true);

  try {
    const fd = new FormData();
    fd.append('text', text);
    fd.append('lang', document.getElementById('tts-lang').value);
    fd.append('voice', document.getElementById('tts-voice').value);
    fd.append('speed', document.getElementById('tts-speed').value);

    const r = await fetch('/api/synthesize', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json()).detail);
    const d = await r.json();

    document.getElementById('audio-synth').src = d.file;
    document.getElementById('result-synth').classList.add('show');
    document.getElementById('audio-synth').play();
  } catch(e) {
    showError('err-synth', e.message);
  } finally {
    setLoading('btn-synth', 'spin-synth', false);
  }
}

function showFilename(input) {
  const badge = document.getElementById('file-badge');
  badge.innerHTML = input.files[0]
    ? `<span class="filename-badge">${input.files[0].name}</span>` : '';
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const input = document.getElementById('video-file');
  const dt = new DataTransfer();
  dt.items.add(file);
  input.files = dt.files;
  showFilename(input);
}

async function voiceVideo() {
  const file = document.getElementById('video-file').files[0];
  if (!file) return showError('err-video', 'Video seçin.');
  showError('err-video', '');
  setLoading('btn-video', 'spin-video', true);

  try {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('lang', document.getElementById('vid-lang').value);
    fd.append('voice', document.getElementById('vid-voice').value);
    fd.append('speed', document.getElementById('vid-speed').value);
    fd.append('translate_to', document.getElementById('vid-translate').value);

    const r = await fetch('/api/voice-video', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json()).detail);
    const d = await r.json();

    document.getElementById('video-transcript').textContent = d.transcript;
    document.getElementById('video-out').src = d.video;
    document.getElementById('result-video').classList.add('show');
  } catch(e) {
    showError('err-video', e.message);
  } finally {
    setLoading('btn-video', 'spin-video', false);
  }
}

async function translateAndSynth() {
  const text = document.getElementById('tr-text').value.trim();
  if (!text) return showError('err-tr', 'Metin boş olamaz.');
  showError('err-tr', '');
  setLoading('btn-tr', 'spin-tr', true);

  try {
    const tfd = new FormData();
    tfd.append('text', text);
    tfd.append('source', document.getElementById('tr-source').value);
    tfd.append('target', document.getElementById('tr-target').value);

    const tr = await fetch('/api/translate', { method: 'POST', body: tfd });
    if (!tr.ok) throw new Error((await tr.json()).detail);
    const td = await tr.json();

    document.getElementById('tr-translated').textContent = td.translated;

    const sfd = new FormData();
    sfd.append('text', td.translated);
    sfd.append('lang', document.getElementById('tr-target').value);
    sfd.append('voice', document.getElementById('tr-voice').value);
    sfd.append('speed', document.getElementById('tr-speed').value);

    const sr = await fetch('/api/synthesize', { method: 'POST', body: sfd });
    if (!sr.ok) throw new Error((await sr.json()).detail);
    const sd = await sr.json();

    document.getElementById('audio-tr').src = sd.file;
    document.getElementById('result-tr').classList.add('show');
    document.getElementById('audio-tr').play();
  } catch(e) {
    showError('err-tr', e.message);
  } finally {
    setLoading('btn-tr', 'spin-tr', false);
  }
}

loadMeta();
</script>
</body>
</html>
