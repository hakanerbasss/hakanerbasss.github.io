<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instube — Giriş</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    }

    .logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-text {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo-text .in { color: #e1306c; }
    .logo-text .tube { color: #ff0000; }

    .logo-sub {
      font-size: 12px;
      color: #555;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #777;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    input[type="password"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus {
      border-color: #e1306c;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #e1306c, #c13584);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.3px;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }

    .error-msg {
      background: #2d0a14;
      border: 1px solid #5a1a2a;
      color: #f87171;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .error-msg.show { display: block; }

    .divider {
      height: 1px;
      background: #1e1e1e;
      margin: 24px 0;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-text">
        <span class="in">Inst</span><span class="tube">ube</span>
      </div>
      <div class="logo-sub">İçerik Yönetim Paneli</div>
    </div>

    <div class="error-msg" id="errMsg">Şifre yanlış, tekrar deneyin.</div>

    <form method="POST" action="/login" id="loginForm">
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" name="password" id="pwInput" placeholder="••••••••" autofocus autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Giriş Yap</button>
    </form>

    <div class="divider"></div>
    <div class="footer">Instube · Supertonic Media</div>
  </div>

  <script>
    // Header'dan hata kontrolü
    const params = new URLSearchParams(window.location.search);
    if (params.get('err') === '1') {
      document.getElementById('errMsg').classList.add('show');
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const pw = document.getElementById('pwInput').value;
      const fd = new FormData();
      fd.append('password', pw);

      const r = await fetch('/login', { method: 'POST', body: fd, redirect: 'manual' });
      if (r.status === 0 || r.type === 'opaqueredirect') {
        window.location.href = '/';
      } else if (r.status === 401) {
        document.getElementById('errMsg').classList.add('show');
        document.getElementById('pwInput').value = '';
        document.getElementById('pwInput').focus();
      } else {
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
