<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640">
  <!-- Arka plan -->
  <rect width="360" height="640" fill="#1a1a1a"/>

  <!-- Koyu overlay gradient -->
  <defs>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Sahte fotoğraf dokusu -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <rect width="360" height="640" fill="url(#bg)"/>

  <!-- Sahte şehir silueti -->
  <rect x="0" y="420" width="360" height="220" fill="#111"/>
  <rect x="20" y="360" width="40" height="80" fill="#1a1a2e"/>
  <rect x="70" y="340" width="30" height="100" fill="#16213e"/>
  <rect x="110" y="380" width="50" height="60" fill="#1a1a2e"/>
  <rect x="170" y="320" width="35" height="120" fill="#0f3460"/>
  <rect x="215" y="355" width="45" height="85" fill="#16213e"/>
  <rect x="270" y="345" width="30" height="95" fill="#1a1a2e"/>
  <rect x="310" y="370" width="50" height="70" fill="#0f3460"/>

  <!-- Pencereler -->
  <rect x="28" y="368" width="6" height="6" fill="#f39c12" opacity="0.8"/>
  <rect x="38" y="368" width="6" height="6" fill="#f39c12" opacity="0.5"/>
  <rect x="28" y="380" width="6" height="6" fill="#f39c12" opacity="0.3"/>
  <rect x="178" y="330" width="6" height="6" fill="#3498db" opacity="0.7"/>
  <rect x="188" y="330" width="6" height="6" fill="#3498db" opacity="0.4"/>
  <rect x="178" y="345" width="6" height="6" fill="#f39c12" opacity="0.6"/>
  <rect x="220" y="365" width="6" height="6" fill="#f39c12" opacity="0.5"/>
  <rect x="232" y="365" width="6" height="6" fill="#3498db" opacity="0.7"/>
  <rect x="220" y="378" width="6" height="6" fill="#f39c12" opacity="0.3"/>

  <rect width="360" height="640" fill="url(#vignette)"/>

  <!-- ── BAŞLIK ALANI — merkez ── -->

  <!-- Üst dekoratif şerit (ince sarı) -->
  <rect x="0" y="185" width="360" height="4" fill="#FFD700"/>

  <!-- Küçük üst etiket bandı -->
  <rect x="0" y="189" width="360" height="38" fill="#FFD700"/>
  <text x="180" y="215" font-family="Arial Black, sans-serif" font-size="17" font-weight="900"
        fill="#111" text-anchor="middle" letter-spacing="3">» GÜNDEM «</text>

  <!-- Ana başlık satırı 1 — geniş sarı bant -->
  <rect x="0" y="231" width="360" height="72" fill="#FFD700"/>
  <text x="180" y="285" font-family="Arial Black, sans-serif" font-size="46" font-weight="900"
        fill="#111" text-anchor="middle">İNGİLTERE'DE</text>

  <!-- Satır 2 — siyah ara -->
  <rect x="0" y="307" width="360" height="8" fill="#111"/>

  <!-- Satır 2 — sarı bant -->
  <rect x="0" y="315" width="360" height="68" fill="#FFD700"/>
  <text x="180" y="363" font-family="Arial Black, sans-serif" font-size="42" font-weight="900"
        fill="#111" text-anchor="middle">İKİ TREN</text>

  <!-- Satır 3 — siyah ara -->
  <rect x="0" y="387" width="360" height="8" fill="#111"/>

  <!-- Satır 3 — sarı bant (biraz daha büyük) -->
  <rect x="0" y="395" width="360" height="74" fill="#FFD700"/>
  <text x="180" y="448" font-family="Arial Black, sans-serif" font-size="48" font-weight="900"
        fill="#111" text-anchor="middle">ÇARPIŞTI!</text>

  <!-- Alt ince sarı çizgi -->
  <rect x="0" y="473" width="360" height="4" fill="#FFD700"/>

  <!-- SON DAKİKA kırmızı bant -->
  <rect x="0" y="477" width="360" height="56" fill="#D50000"/>
  <!-- Yan dekoratif çizgiler -->
  <rect x="0" y="477" width="6" height="56" fill="#FF1744"/>
  <rect x="354" y="477" width="6" height="56" fill="#FF1744"/>
  <text x="180" y="515" font-family="Arial Black, sans-serif" font-size="26" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="4">SON DAKİKA</text>

  <!-- Alt ince beyaz çizgi -->
  <rect x="0" y="533" width="360" height="2" fill="rgba(255,255,255,0.2)"/>

</svg>
