<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Story Video Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="app-header">
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
    <rect width="28" height="28" rx="8" fill="#7c6af7"/>
    <path d="M10 9l9 5-9 5V9z" fill="white"/>
  </svg>
  <h1>Story Video Generator</h1>
  <span class="badge">Beta</span>
  <div class="yt-badge" id="ytBadge">
    <div class="dot"></div>
    <span>YouTube bağlı değil</span>
  </div>
</header>

<main class="layout">

  <!-- ── Sol Panel: Girdi ── -->
  <aside class="panel-left">

    <div class="field">
      <label>Video Başlığı</label>
      <input type="text" id="title" placeholder="Örnek: Yalnız Adam — Bölüm 3" maxlength="200">
    </div>

    <div class="field">
      <label>Hikaye Metni (Türkçe)</label>
      <textarea id="storyText" placeholder="Roman veya hikaye metnini buraya yapıştırın...&#10;&#10;DeepSeek metni otomatik sahnelere böler, her sahne için Pexels'tan fotoğraf seçer ve TTS ile seslendirir."></textarea>
      <span class="hint" id="charCount">0 karakter</span>
    </div>

    <div class="field">
      <label>Video Formatı</label>
      <div class="format-toggle">
        <button class="format-btn active" data-fmt="shorts" onclick="setFormat('shorts')">
          <div class="icon">📱</div>
          <div class="name">Shorts</div>
          <div class="dims">1080×1920</div>
        </button>
        <button class="format-btn" data-fmt="landscape" onclick="setFormat('landscape')">
          <div class="icon">🖥️</div>
          <div class="name">Yatay</div>
          <div class="dims">1920×1080</div>
        </button>
      </div>
    </div>

    <details>
      <summary style="cursor:pointer;color:var(--muted);font-size:13px;user-select:none;margin-bottom:8px">
        YouTube Yükleme Ayarları ▸
      </summary>
      <div class="yt-panel" style="margin-top:12px">
        <div class="field">
          <label>YouTube Açıklaması</label>
          <textarea id="ytDesc" style="min-height:80px" placeholder="Kanal açıklaması, hashtag'ler..."></textarea>
        </div>
        <div class="field">
          <label>Etiketler (virgülle ayırın)</label>
          <input type="text" id="ytTags" placeholder="roman, hikaye, türkçe, shorts">
        </div>
        <div class="field">
          <label>Gizlilik</label>
          <select id="ytPrivacy">
            <option value="private">Gizli (Private)</option>
            <option value="unlisted">Bağlantıyla (Unlisted)</option>
            <option value="public">Herkese Açık</option>
          </select>
        </div>
        <button class="btn btn-outline" onclick="connectYouTube()" id="btnYtConnect">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2c-.3-1-1-1.8-2-2.1C19.6 3.5 12 3.5 12 3.5s-7.6 0-9.5.6c-1 .3-1.7 1.1-2 2.1C0 8.1 0 12 0 12s0 3.9.5 5.8c.3 1 1 1.8 2 2.1 1.9.6 9.5.6 9.5.6s7.6 0 9.5-.6c1-.3 1.7-1.1 2-2.1.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.75 15.5v-7l6.25 3.5-6.25 3.5z"/></svg>
          YouTube'a Bağlan (OAuth)
        </button>
      </div>
    </details>

    <button class="btn btn-primary btn-full" id="btnGenerate" onclick="startGenerate()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Video Üret
    </button>

  </aside>

  <!-- ── Sağ Panel: Durum + Sonuç ── -->
  <section class="panel-right" id="rightPanel">
    <div class="empty-state" id="emptyState">
      <div class="icon">🎬</div>
      <div style="font-size:16px;font-weight:600;color:var(--text)">Hazır</div>
      <div>Metni girin ve "Video Üret" butonuna tıklayın.</div>
    </div>
  </section>

</main>

<script src="/static/app.js"></script>
</body>
</html>
