<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="@hakanerbasss | Amazon Viral Ürünler">
  <meta property="og:description" content="Viral Amazon ürünleri — komisyonlu linklerle">
  <title>@hakanerbasss | Amazon Viral Ürünler</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --card: #12121e;
      --border: #1e1e30;
      --accent: #ff3c78;
      --accent2: #ff6b35;
      --gold: #ffc800;
      --text: #f0f0f0;
      --muted: #888;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #0a0a0f 0%, #1a0a1e 100%);
      border-bottom: 1px solid var(--border);
      padding: 24px 16px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    header h1 { font-size: 1.4rem; color: var(--accent); letter-spacing: 1px; }
    header p  { color: var(--muted); font-size: .8rem; margin-top: 4px; }

    /* ── Category filter ── */
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 14px 16px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: .78rem;
      cursor: pointer;
      transition: .2s;
      white-space: nowrap;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Product grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 4px 12px 12px;
      max-width: 900px;
      margin: 0 auto;
    }
    @media(min-width: 600px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media(min-width: 900px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* ── Product card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .2s, border-color .2s;
    }
    .card:hover { transform: translateY(-2px); border-color: #2e2e48; }

    .card-img {
      position: relative;
      aspect-ratio: 1;
      background: #111;
      overflow: hidden;
    }
    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
    }
    .card-img img.error { display: none; }
    .img-placeholder {
      display: none;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 2.5rem;
    }
    .card-img img.error + .img-placeholder { display: flex; }

    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--accent);
      color: #fff;
      font-size: .6rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: .3px;
    }
    .badge.gold { background: var(--gold); color: #111; }

    .card-body { padding: 10px 10px 12px; flex: 1; display: flex; flex-direction: column; }
    .cat-tag {
      font-size: .62rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 5px;
    }
    .card-title {
      font-size: .78rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold);
      margin: 8px 0 10px;
    }

    .card-actions { display: flex; flex-direction: column; gap: 6px; }
    .btn {
      display: block;
      text-align: center;
      padding: 9px 8px;
      border-radius: 9px;
      font-size: .73rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-amazon {
      background: var(--accent);
      color: #fff;
    }
    .btn-instagram {
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      color: #fff;
    }
    .btn:hover { opacity: .88; }

    /* ── Toast notification ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e1e30;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: .82rem;
      font-weight: 600;
      transition: transform .3s;
      z-index: 999;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty span { font-size: 2.5rem; display: block; margin-bottom: 12px; }

    /* ── How-to banner ── */
    .howto {
      background: #0e0e1e;
      border: 1px solid #1e1e40;
      border-radius: 12px;
      margin: 0 12px 16px;
      padding: 12px 14px;
      font-size: .76rem;
      color: #aaa;
      line-height: 1.6;
    }
    .howto strong { color: var(--accent); }
  </style>
</head>
<body>

<header>
  <h1>@hakanerbasss</h1>
  <p>Amazon viral ürünler — komisyonlu linkler</p>
</header>

<div class="filters" id="filters">
  <button class="filter-btn active" onclick="filter('all', this)">Tümü</button>
</div>

<div class="howto">
  <strong>Nasıl paylaşılır?</strong> "Instagram'da Paylaş" butonuna bas →
  link otomatik kopyalanır → Instagram'ı aç → Bio'ya ya da Story'ye yapıştır.
</div>

<div class="grid" id="grid"></div>
<div id="toast">✓ Link kopyalandı! Instagram'ı aç ve yapıştır.</div>

<script>
// =====================================================
// ÜRÜN LİSTESİ — BU KISMI GÜNCELLE
//
// Yeni ürün eklemek için:
// 1. Amazon'da ürünü bul (amazon.com/movers-and-shakers)
// 2. Ürün URL'sindeki /dp/B0XXXXXXX kısmını kopyala → asin
// 3. Fiyatı ve başlığı buraya yapıştır
// 4. Kaydet — resimler Amazon'dan otomatik yüklenir
// =====================================================
const AFFILIATE_TAG = "hakanerb-20";

const products = [
  // ── Elektronik
  {
    asin: "B0BP9SNVH9",
    title: "Amazon Fire TV Stick 4K Max Streaming Device",
    price: "$49.99",
    category: "Elektronik",
    badge: "🔥 Bestseller"
  },
  {
    asin: "B0CZ9LV3H2",
    title: "Anker Portable Charger 10,000mAh 30W Power Bank",
    price: "$19.99",
    category: "Elektronik",
    badge: "⚡ Viral"
  },
  {
    asin: "B0C6XK77HJ",
    title: "Anker Nano Power Bank 5,000mAh 22.5W Built-in USB-C",
    price: "$15.99",
    category: "Elektronik",
    badge: null
  },
  {
    asin: "B0DGKWTQQC",
    title: "Anker Nano Portable Charger 45W 10,000mAh Retractable",
    price: "$24.99",
    category: "Elektronik",
    badge: "🆕 Yeni"
  },
  // ── Akıllı Ev
  {
    asin: "B09B8V1LZ3",
    title: "Amazon Echo Dot 5th Gen Smart Speaker Alexa Charcoal",
    price: "$49.99",
    category: "Akıllı Ev",
    badge: "🔥 Bestseller"
  },
  {
    asin: "B07X6C9RMF",
    title: "Blink Mini Indoor Security Camera 1080p HD Night Vision",
    price: "$34.99",
    category: "Akıllı Ev",
    badge: null
  },
  {
    asin: "B0BWX39R5W",
    title: "Blink Mini 2 Home Security Camera Color Night View",
    price: "$39.99",
    category: "Akıllı Ev",
    badge: "🆕 Yeni"
  },
  {
    asin: "B07N1CMGQQ",
    title: "Govee Smart RGB LED Strip Lights 16.4ft WiFi Alexa",
    price: "$15.99",
    category: "Akıllı Ev",
    badge: "⚡ Viral"
  },
  {
    asin: "B0991Q94KP",
    title: "Govee RGBIC LED Strip Lights Bluetooth 16.4ft App Control",
    price: "$19.99",
    category: "Akıllı Ev",
    badge: null
  },
  {
    asin: "B079B7SHD8",
    title: "Kasa Smart Plug Wi-Fi Outlet Works with Alexa (HS103)",
    price: "$14.99",
    category: "Akıllı Ev",
    badge: null
  },
  // ── Güzellik & Sağlık
  {
    asin: "B074PVTPBW",
    title: "Mighty Patch Original Hydrocolloid Acne Patches 36ct",
    price: "$12.99",
    category: "Güzellik",
    badge: "🔥 Bestseller"
  },
  {
    asin: "B07KJS13PK",
    title: "Mighty Patch Invisible+ Daytime Acne Patches 39ct",
    price: "$14.99",
    category: "Güzellik",
    badge: "⚡ Viral"
  },
  // ── Mutfak
  {
    asin: "B010TCP3SC",
    title: "Dash Mini Waffle Maker Electric Iron Nonstick 4 inch",
    price: "$9.99",
    category: "Mutfak",
    badge: "⚡ Viral"
  },
  {
    asin: "B00FLYWNYQ",
    title: "Instant Pot Duo 7-in-1 Electric Pressure Cooker 6 Quart",
    price: "$79.99",
    category: "Mutfak",
    badge: "🔥 Bestseller"
  },
  // ── Araba
  {
    asin: "B07SMBHRKN",
    title: "Universal Magnetic Car Phone Mount Dashboard One-Hand",
    price: "$14.99",
    category: "Araba",
    badge: null
  },
  // ── Araçlar
  {
    asin: "B095JZ33XX",
    title: "RAK Universal Socket Grip with Magnetic Wristband Bundle",
    price: "$29.99",
    category: "Araçlar",
    badge: "⚡ Viral"
  },
];

// ── Affiliate link builder
function amazonLink(asin) {
  return `https://www.amazon.com/dp/${asin}?tag=${AFFILIATE_TAG}`;
}

// ── Amazon image URL (official Associates image widget — komisyonlu)
function amazonImg(asin) {
  return `https://ws-na.amazon-adsystem.com/widgets/q?_encoding=UTF8&ASIN=${asin}&Format=_SL300_&ID=AsinImage&MarketPlace=US&ServiceVersion=20070822&WS=1&tag=${AFFILIATE_TAG}&language=en_US`;
}

// ── Render
let currentFilter = 'all';

function getCategories() {
  return ['Tümü', ...new Set(products.map(p => p.category))];
}

function buildFilters() {
  const cats = getCategories();
  const container = document.getElementById('filters');
  container.innerHTML = '';
  cats.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (i === 0 ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = function() { filter(cat === 'Tümü' ? 'all' : cat, this); };
    container.appendChild(btn);
  });
}

function filter(cat, el) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const filtered = currentFilter === 'all'
    ? products
    : products.filter(p => p.category === currentFilter);

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty"><span>🔍</span>Ürün bulunamadı</div>';
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const link     = amazonLink(p.asin);
    const imgUrl   = amazonImg(p.asin);
    const badgeHtml = p.badge
      ? `<span class="badge${p.badge.includes('⚡') ? '' : ''}">${p.badge}</span>`
      : '';

    return `
    <div class="card">
      <div class="card-img">
        <img
          src="${imgUrl}"
          alt="${p.title}"
          loading="lazy"
          onerror="this.classList.add('error')"
        >
        <div class="img-placeholder">📦</div>
        ${badgeHtml}
      </div>
      <div class="card-body">
        <div class="cat-tag">${p.category}</div>
        <div class="card-title">${p.title}</div>
        <div class="card-price">${p.price}</div>
        <div class="card-actions">
          <a class="btn btn-amazon" href="${link}" target="_blank" rel="nofollow">
            Amazon'da Gör →
          </a>
          <button class="btn btn-instagram" onclick="shareProduct('${p.asin}', this)">
            📲 Instagram'da Paylaş
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Share — clipboard + Instagram deep link
function shareProduct(asin, btn) {
  const link = amazonLink(asin);

  // Clipboard
  if (navigator.clipboard) {
    navigator.clipboard.writeText(link).catch(() => fallbackCopy(link));
  } else {
    fallbackCopy(link);
  }

  showToast();

  // Web Share API (native share sheet on mobile)
  if (navigator.share) {
    navigator.share({
      title: 'Amazon ürünü',
      text: 'Bunu gördün mü? 🔥',
      url: link,
    }).catch(() => {});
  }
}

function fallbackCopy(text) {
  const el = document.createElement('textarea');
  el.value = text;
  el.style.position = 'fixed';
  el.style.opacity = '0';
  document.body.appendChild(el);
  el.select();
  document.execCommand('copy');
  document.body.removeChild(el);
}

let toastTimer;
function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
}

// ── Init
buildFilters();
renderGrid();
</script>
</body>
</html>
