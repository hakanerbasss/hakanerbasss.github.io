name: Namaz Vakitleri - SDK 36 test build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: namazvakitleri
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36 platform + build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Repo main compileSdk 35'te tutuluyor (Termux'ta build alinabilsin diye).
      # Bu sadece bu isde, resmi/guncel Android SDK araclariyla compileSdk 36'nin
      # gercekten derlenip derlenmedigini test etmek icin gecici olarak yukseltir.
      - name: Force compileSdk/targetSdk 36 for this diagnostic build
        run: |
          sed -i 's/compileSdk 35/compileSdk 36/' app/build.gradle
          sed -i 's/targetSdk 35/targetSdk 36/' app/build.gradle
          grep -E "compileSdk|targetSdk" app/build.gradle

      # aapt2FromMavenOverride Termux'un kendi binary yoluna sabitli - bu yol
      # GitHub runner'inda yok. CI'da AGP'nin kendi (guncel, resmi) aapt2'sini
      # Maven'den cozmesine izin vermek icin bu satiri kaldiriyoruz.
      - name: Remove Termux-specific aapt2 override
        run: |
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties
          cat gradle.properties

      # Termux'un telefon RAM'i icin kisitli -Xmx512m ayari GitHub runner'inda
      # OutOfMemoryError'a yol aciyor (ilk denemede build 4 dk surup 25 gorevden
      # sonra bellek yetersizliginden dustu - aapt2/SDK36 sorunu degildi).
      # CI'da bol RAM oldugu icin bunu buyutuyoruz.
      - name: Increase JVM heap for CI runner
        run: |
          sed -i 's/-Xmx512m -XX:MaxMetaspaceSize=256m/-Xmx3072m -XX:MaxMetaspaceSize=1024m/' gradle.properties
          cat gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: namaz-vakitleri-debug-sdk36
          path: namazvakitleri/app/build/outputs/apk/debug/*.apk
