name: Bathonea Deploy

on:
  push:
    branches: [main]
    paths:
      - 'bathonea/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Sunucuya deploy et
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ATIK_SSH_HOST }}
          username: ${{ secrets.ATIK_SSH_USER }}
          key: ${{ secrets.ATIK_SSH_KEY }}
          script: |
            cd ~/hakanerbasss.github.io
            git fetch origin main
            git reset --hard origin/main
            git sparse-checkout reapply
            DEST=~/bathonea/bathonea
            mkdir -p $DEST
            cp bathonea/app.py $DEST/
            cp bathonea/db.py $DEST/
            cp bathonea/ocr.py $DEST/
            cp bathonea/ai.py $DEST/
            cp bathonea/manage.py $DEST/
            cp bathonea/requirements.txt $DEST/
            cp -r bathonea/templates $DEST/
            cp -r bathonea/static $DEST/
            find $DEST -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
            ~/bathonea/venv/bin/pip install -q -r $DEST/requirements.txt
            systemctl restart bathonea
            systemctl status bathonea --no-pager
