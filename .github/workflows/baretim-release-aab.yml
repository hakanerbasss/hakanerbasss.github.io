name: Baretim Mavi - Build Signed Release AAB

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: baretim-mavi-admob

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use CI-friendly gradle.properties
        run: |
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m/' gradle.properties

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BARETIM_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.BARETIM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BARETIM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BARETIM_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: baretim-mavi-release-aab
          path: baretim-mavi-admob/app/build/outputs/bundle/release/app-release.aab

      - name: Publish to Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bluechip.finance
          releaseFiles: baretim-mavi-admob/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
