name: Instagram Auto Post

on:
  schedule:
    # Her 6 saatte bir: 08:00, 14:00, 20:00, 02:00 UTC (TR: 11:00, 17:00, 23:00, 05:00)
    - cron: "0 8,14,20,2 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: instagram-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r instagram-bot/requirements.txt

      - name: Run bot
        working-directory: instagram-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PRODUCT_NICHE: ${{ vars.PRODUCT_NICHE || 'viral gadgets' }}
          MAX_POSTS_PER_DAY: "1"
        run: python app.py --once

      - name: Upload images (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posts-${{ github.run_number }}
          path: instagram-bot/output/
          retention-days: 7
