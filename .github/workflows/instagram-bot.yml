name: Instagram Auto Post

on:
  schedule:
    - cron: "0 8,14,20,2 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: instagram-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r instagram-bot/requirements.txt

      # Adım 1: Ürün bul, görselleri üret ve TAM PAKETİ Telegram'a gönder
      - name: Generate post & send to Telegram
        working-directory: instagram-bot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCT_NICHE: ${{ vars.PRODUCT_NICHE || 'viral gadgets' }}
        run: python app.py --once

      # Adım 2: shop.html (bio linki) commit et + push
      - name: Commit & push shop page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram-bot/public/ shop.html || true
          git diff --staged --quiet && echo "Değişiklik yok" && exit 0
          git commit -m "chore: update post image and shop link [skip ci]"
          git push

      # Instagram'a otomatik atılmaz — paket Telegram'a gider, elle koyarsın.
