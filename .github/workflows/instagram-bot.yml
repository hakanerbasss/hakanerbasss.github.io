name: Instagram Auto Post

on:
  schedule:
    - cron: "0 8,14,20,2 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: instagram-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r instagram-bot/requirements.txt

      # Adım 1: Görsel + caption üret, public/ klasörüne kaydet
      - name: Generate post
        working-directory: instagram-bot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCT_NICHE: ${{ vars.PRODUCT_NICHE || 'viral gadgets' }}
        run: python app.py --once

      # Adım 2: Görsel + shop.html commit et + push
      - name: Commit & push image and shop page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram-bot/public/ shop.html
          git diff --staged --quiet && echo "Değişiklik yok" && exit 0
          git commit -m "chore: update post image and shop link [skip ci]"
          git push

      # Adım 3: 90sn bekle (GitHub raw URL aktif olsun)
      - name: Wait for GitHub to serve image
        run: sleep 90

      # Adım 4: Instagram Graph API ile yayınla
      - name: Post to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os, sys
          sys.path.insert(0, "instagram-bot")
          from instagram_graph import post_to_instagram

          token = os.environ.get("IG_ACCESS_TOKEN", "")
          user_id = os.environ.get("IG_USER_ID", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")

          if not token or not user_id:
              print("IG_ACCESS_TOKEN veya IG_USER_ID eksik, atlanıyor.")
              sys.exit(0)

          caption_file = "instagram-bot/public/latest_caption.txt"
          if os.path.exists(caption_file):
              caption = open(caption_file).read()
          else:
              caption = "🔥 Viral product! #viral #trending #deals"

          image_url = f"https://raw.githubusercontent.com/{repo}/main/instagram-bot/public/latest.jpg"
          print(f"Image URL: {image_url}")

          ok = post_to_instagram(user_id, token, image_url, caption)
          sys.exit(0 if ok else 1)
          EOF
