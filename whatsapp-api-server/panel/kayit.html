<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Kayıt — WhatsApp API</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#25D366">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<style>
:root{--bg:#0a0e14;--surface:#0f1419;--card:#111820;--border:#1e2733;--accent:#25D366;--accent2:#00d4ff;--red:#ff4444;--text:#e8f4f8;--muted:#4a6070;}
[data-theme="light"]{--bg:#f0f4f8;--surface:#ffffff;--card:#ffffff;--border:#dde3ea;--accent:#25D366;--accent2:#0088cc;--red:#dc3545;--text:#1a2332;--muted:#6b7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.back-btn{position:fixed;top:16px;left:16px;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px;text-decoration:none;z-index:10;transition:all .2s;}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}
.box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:420px;}
.logo{text-align:center;font-size:48px;margin-bottom:12px;}
h1{text-align:center;font-size:22px;font-weight:800;margin-bottom:6px;}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;line-height:1.6;}
.badge{display:inline-block;background:rgba(37,211,102,.15);color:var(--accent);border:1px solid rgba(37,211,102,.3);border-radius:20px;padding:4px 14px;font-size:12px;margin-bottom:20px;}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
input{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;outline:none;margin-bottom:12px;transition:border-color .2s;}
input:focus{border-color:var(--accent);}
.btn{width:100%;padding:13px;border-radius:10px;border:none;cursor:pointer;font-size:15px;font-weight:700;background:var(--accent);color:#000;transition:all .2s;margin-top:4px;}
.btn:hover{background:#20c05a;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.alert{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;line-height:1.5;}
.alert-red{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.3);color:var(--red);}

/* Token gösterim ekranı */
.token-screen{display:none;text-align:center;}
.token-icon{font-size:56px;margin-bottom:12px;}
.token-title{font-size:20px;font-weight:800;margin-bottom:8px;}
.token-sub{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.6;}
.token-box{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:16px;font-family:monospace;font-size:13px;word-break:break-all;cursor:pointer;transition:all .2s;margin-bottom:8px;}
.token-box:hover{background:rgba(37,211,102,.05);}
.warn-box{background:rgba(255,200,0,.08);border:1px solid rgba(255,200,0,.3);border-radius:10px;padding:12px 14px;font-size:12px;color:#ffd700;margin-bottom:16px;line-height:1.6;}
.btn-dash{display:block;text-decoration:none;width:100%;padding:13px;border-radius:10px;border:none;cursor:pointer;font-size:15px;font-weight:700;background:var(--accent);color:#000;text-align:center;margin-top:8px;}
</style>
</head>
<body>
<a href="/" class="back-btn" title="Ana Sayfa">←</a>
<div class="box">

  <!-- Kayıt Formu -->
  <div id="form-screen">
    <div class="logo">📱</div>
    <h1>WhatsApp API</h1>
    <p class="sub">Ücretsiz demo ile hemen başlayın</p>
    <div style="text-align:center;margin-bottom:20px">
      <span class="badge">🎁 50 Ücretsiz Mesaj</span>
    </div>
    <div id="form-alert"></div>
    <div>
      <label>Ad Soyad *</label>
      <input type="text" id="f-name" placeholder="Ahmet Yılmaz">
    </div>
    <div>
      <label>Telefon * (WhatsApp numaranız)</label>
      <input type="tel" id="f-phone" placeholder="+905551234567">
    </div>
    <div>
      <label>E-posta (opsiyonel)</label>
      <input type="email" id="f-email" placeholder="ahmet@mail.com">
    </div>
    <button class="btn" id="submit-btn" onclick="doRegister()">🚀 Demo Başlat</button>
  </div>

  <!-- Token Gösterim -->
  <div class="token-screen" id="token-screen">
    <div class="token-icon">🎉</div>
    <div class="token-title">Demo hesabınız hazır!</div>
    <div class="token-sub">API token'ınız aşağıda. Dashboard'a giriş için gerekli.</div>
    <div class="token-box" id="token-val" onclick="copyToken()">...</div>
    <div style="font-size:11px;color:var(--accent2);margin-bottom:14px">👆 Token'a tıklayarak kopyala</div>
    <div class="warn-box">
      ⚠️ Bu token'ı güvenli bir yere kaydedin!<br>
      Şifre gibi işlev görür — kaybolursa kurtarılamaz.
    </div>
    <a class="btn-dash" id="dash-link" href="#">📊 Dashboard'a Git</a>
  </div>

</div>
<script>
(function(){
  const t = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
function copyToClipboard(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));}else{fallbackCopy(text);}}function fallbackCopy(text){var el=document.createElement("textarea");el.value=text;el.style.position="fixed";el.style.opacity="0";document.body.appendChild(el);el.focus();el.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(el);}
async function doRegister() {
  const name  = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const email = document.getElementById('f-email').value.trim();

  if (!name || !phone) {
    document.getElementById('form-alert').innerHTML =
      '<div class="alert alert-red">Ad ve telefon zorunlu!</div>';
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Kaydediliyor...';

  const r = await fetch('/api/demo/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, phone, email })
  });
  const data = await r.json();

  if (data.ok) {
    document.getElementById('form-screen').style.display = 'none';
    document.getElementById('token-screen').style.display = 'block';
    document.getElementById('token-val').textContent = data.token;
    document.getElementById('dash-link').href = '/musteri?token=' + data.token;
  } else if (data.blacklisted) {
    // Kara listede — admin WhatsApp butonu göster
    const waPhone = data.contact?.phone?.replace(/\D/g,'') || '';
    const msg = encodeURIComponent(`Merhaba! Demo kullandım, ücretli üyelik almak istiyorum.\nTelefon: ${document.getElementById('f-phone').value}`);
    document.getElementById('form-alert').innerHTML = `
      <div class="alert alert-red">
        <div style="font-weight:700;margin-bottom:8px">⛔ ${data.error}</div>
        <div style="font-size:12px;margin-bottom:12px">${data.contact?.message || 'Ücretli üyelik için iletişime geçin'}</div>
        ${waPhone ? `<a href="https://wa.me/${waPhone}?text=${msg}" 
          style="display:block;padding:10px;background:rgba(37,211,102,.2);color:#25D366;border-radius:8px;text-decoration:none;text-align:center;font-weight:700">
          💬 WhatsApp ile İletişime Geç</a>` : ''}
      </div>`;
    btn.disabled = false;
    btn.textContent = '🚀 Demo Başlat';
  } else {
    document.getElementById('form-alert').innerHTML =
      `<div class="alert alert-red">${data.error}</div>`;
    btn.disabled = false;
    btn.textContent = '🚀 Demo Başlat';
  }
}

function copyToken() {
  const token = document.getElementById('token-val').textContent;
  copyToClipboard(token).then(() => {
    const el = document.getElementById('token-val');
    el.textContent = '✅ Kopyalandı!';
    setTimeout(() => el.textContent = token, 2000);
  });
}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
