<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp API Panel</title>
<style>
:root{--bg:#0a0e14;--surface:#0f1419;--card:#111820;--border:#1e2733;--accent:#25D366;--accent2:#00d4ff;--red:#ff4444;--yellow:#ffd700;--text:#e8f4f8;--muted:#4a6070;}
[data-theme="light"]{--bg:#f0f4f8;--surface:#ffffff;--card:#ffffff;--border:#dde3ea;--accent:#25D366;--accent2:#0088cc;--red:#dc3545;--yellow:#f59e0b;--text:#1a2332;--muted:#6b7280;}
.copy-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--accent2);font-size:11px;cursor:pointer;transition:all .2s;float:right;margin-top:-2px;}
.copy-btn:hover{background:rgba(0,212,255,.1);}
.copy-btn.copied{color:var(--accent);border-color:var(--accent);}
.api-doc-wrap{position:relative;}
.theme-btn{width:36px;height:36px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;}
/* Auth */
.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.auth-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:400px;}
.auth-logo{text-align:center;font-size:32px;margin-bottom:8px;}
.auth-title{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px;}
.auth-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;}
/* Layout */
.app{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--card);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;display:flex;flex-direction:column;}
.sidebar-logo{padding:0 16px 16px;font-size:18px;font-weight:800;border-bottom:1px solid var(--border);}
.sidebar-logo span{color:var(--accent);}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;color:var(--muted);font-size:14px;transition:all .2s;}
.nav-item:hover,.nav-item.active{color:var(--text);background:rgba(37,211,102,.08);border-left:3px solid var(--accent);}
.main{flex:1;overflow-y:auto;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--border);}
.topbar-title{font-size:16px;font-weight:700;}
.content{padding:20px;}
/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.card-title{font-size:12px;color:var(--accent2);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.stat-num{font-size:28px;font-weight:800;color:var(--accent);}
.stat-label{font-size:11px;color:var(--muted);margin-top:4px;}
/* Table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:10px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border);}
td{padding:10px 12px;border-bottom:1px solid rgba(30,39,51,.5);}
tr:hover td{background:rgba(255,255,255,.02);}
/* Badges */
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;}
.badge-green{background:rgba(37,211,102,.15);color:var(--accent);border:1px solid rgba(37,211,102,.3);}
.badge-red{background:rgba(255,68,68,.15);color:var(--red);border:1px solid rgba(255,68,68,.3);}
.badge-yellow{background:rgba(255,215,0,.1);color:var(--yellow);border:1px solid rgba(255,215,0,.3);}
.badge-blue{background:rgba(0,212,255,.1);color:var(--accent2);border:1px solid rgba(0,212,255,.3);}
.badge-gray{background:rgba(74,96,112,.2);color:var(--muted);border:1px solid var(--border);}
/* Forms */
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
input,select,textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;transition:border-color .2s;-webkit-appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
.field{margin-bottom:12px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
/* Buttons */
.btn{padding:9px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;}
.btn-primary{background:var(--accent);color:#000;}
.btn-primary:hover{background:#20c05a;}
.btn-danger{background:rgba(255,68,68,.15);color:var(--red);border:1px solid rgba(255,68,68,.3);}
.btn-ghost{background:var(--surface);color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);}
.btn-blue{background:rgba(0,212,255,.15);color:var(--accent2);border:1px solid rgba(0,212,255,.3);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-full{width:100%;padding:12px;}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.modal-close{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;}
/* QR */
.qr-wrap{text-align:center;padding:20px;}
.qr-wrap img{border-radius:12px;border:3px solid var(--accent);max-width:250px;}
.qr-method-btns{display:flex;gap:8px;margin-bottom:16px;justify-content:center;}
.conn-status{text-align:center;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;}
.conn-status.connected{background:rgba(37,211,102,.1);color:var(--accent);}
.conn-status.connecting{background:rgba(255,215,0,.1);color:var(--yellow);}
.conn-status.disconnected{background:rgba(255,68,68,.1);color:var(--red);}
/* Token */
.token-box{font-family:monospace;font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;word-break:break-all;cursor:pointer;transition:border-color .2s;}
.token-box:hover{border-color:var(--accent2);}
/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(37,211,102,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
/* Alert */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;}
.alert-green{background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.3);color:var(--accent);}
.alert-red{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.3);color:var(--red);}
/* Responsive */
@media(max-width:600px){
  .sidebar{display:none;position:fixed;inset:0;z-index:200;width:220px;}
  .sidebar.open{display:flex;}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;}
  .sidebar-overlay.show{display:block;}
  .row2{grid-template-columns:1fr;}
  .hamburger{display:flex!important;}
}
.hamburger{display:none;align-items:center;justify-content:center;width:36px;height:36px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:18px;}
/* Customer Panel */
.customer-panel{max-width:600px;margin:0 auto;padding:20px;}
.cp-header{text-align:center;padding:24px 0 16px;}
.cp-logo{font-size:40px;margin-bottom:8px;}
.api-doc{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:12px;line-height:1.8;overflow-x:auto;}
</style>
</head>
<body>

<!-- Setup Sayfası -->
<div id="setup-page" style="display:none">
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">🔧</div>
      <div class="auth-title">İlk Kurulum</div>
      <div class="auth-sub">Admin hesabı oluşturun</div>
      <div id="setup-alert"></div>
      <div class="field"><label>Kullanıcı Adı</label><input id="setup-user" placeholder="admin"></div>
      <div class="field"><label>Şifre</label><input id="setup-pass" type="password" placeholder="••••••••"></div>
      <div class="field"><label>Şifre Tekrar</label><input id="setup-pass2" type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-full" onclick="doSetup()">Hesabı Oluştur</button>
    </div>
  </div>
</div>

<!-- Admin Login -->
<div id="login-page" style="display:none">
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">📱</div>
      <div class="auth-title">WhatsApp API</div>
      <div class="auth-sub">Admin Paneline Giriş</div>
      <div id="login-alert"></div>
      <div class="field"><label>Kullanıcı Adı</label><input id="login-user" placeholder="admin"></div>
      <div class="field"><label>Şifre</label><input id="login-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn btn-primary btn-full" onclick="doLogin()">Giriş Yap</button>
    </div>
  </div>
</div>

<!-- Admin Panel -->
<div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
<div id="admin-panel" style="display:none">
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-logo">WA<span>.</span>API</div>
      <nav style="flex:1;padding-top:8px">
        <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">📊 Dashboard</div>
        <div class="nav-item" onclick="showPage('customers')" id="nav-customers">👥 Müşteriler</div>
        <div class="nav-item" onclick="showPage('docs')" id="nav-docs">📖 API Döküman</div>
        <div class="nav-item" onclick="showPage('settings')" id="nav-settings">⚙️ Ayarlar</div>
        <div class="nav-item" onclick="showPage('blacklist')" id="nav-blacklist">🚫 Kara Liste</div>
        <div class="nav-item" onclick="showPage('broadcast')" id="nav-broadcast">📢 Duyuru</div>
        <div class="nav-item" onclick="showPage('links')" id="nav-links">🔗 Sayfalar</div>
      </nav>
      <div style="padding:16px;border-top:1px solid var(--border)">
        <button class="btn btn-ghost" style="width:100%;font-size:12px" onclick="logout()">🚪 Çıkış</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="hamburger" onclick="toggleSidebar()">☰</div>
          <div class="topbar-title" id="page-title">Dashboard</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">🌙</button>
          <div id="topbar-actions"></div>
        </div>
      </div>
      <div class="content" id="page-content"></div>
    </div>
  </div>
</div>

<!-- Müşteri Paneli (token ile) -->
<div id="customer-panel" style="display:none">
  <div class="customer-panel">
    <div class="cp-header">
      <div class="cp-logo">📱</div>
      <div style="font-size:20px;font-weight:800">WhatsApp API</div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">Müşteri Paneli</div>
    </div>
    <div id="cp-content"></div>
  </div>
</div>

<!-- Modaller -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <span class="modal-close" onclick="closeModal()">×</span>
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const API = '';
let adminToken = localStorage.getItem('admin_token') || '';
let currentCustomerId = null;
let sseSource = null;

// ── BAŞLANGIÇ ────────────────────────────────────────────────────
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
}

function copyCode(el) {
  const text = el.innerText.replace('📋 Kopyala','').replace('📋','').trim();
  copyToClipboard(text);
  el.style.borderColor = 'var(--accent)';
  setTimeout(() => el.style.borderColor = '', 1500);
}

window.addEventListener('DOMContentLoaded', async () => {
  // Tema yükle
  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = savedTheme === 'light' ? '☀️' : '🌙';
  const path = window.location.pathname;

  // Müşteri paneli: /panel?token=xxx → yeni /musteri sayfasına yönlendir
  const urlToken = new URLSearchParams(window.location.search).get('token');
  if (urlToken) {
    window.location.href = '/musteri?token=' + urlToken;
    return;
  }

  // Admin panel
  if (adminToken) {
    try {
      const r = await apiFetch('/api/admin/stats');
      if (r.ok !== false) { showAdminPanel(); return; }
    } catch(e) {}
    adminToken = '';
    localStorage.removeItem('admin_token');
  }

  // Setup veya login
  try {
    const r = await fetch('/api/setup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
    const d = await r.json();
    if (d.error === 'Kurulum zaten tamamlandı') {
      show('login-page');
    } else {
      show('setup-page');
    }
  } catch(e) { show('login-page'); }
});

function show(id) {
  ['setup-page','login-page','admin-panel','customer-panel'].forEach(p => {
    document.getElementById(p).style.display = p === id ? '' : 'none';
  });
}

// ── API HELPER ────────────────────────────────────────────────────
async function apiFetch(url, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if (adminToken) headers['Authorization'] = 'Bearer ' + adminToken;
  const r = await fetch(API + url, { ...options, headers });
  return r.json();
}

// ── SETUP ─────────────────────────────────────────────────────────
async function doSetup() {
  const u = document.getElementById('setup-user').value.trim();
  const p = document.getElementById('setup-pass').value;
  const p2 = document.getElementById('setup-pass2').value;
  if (!u || !p) return alert('Tüm alanları doldurun');
  if (p !== p2) return alert('Şifreler eşleşmiyor');
  const r = await apiFetch('/api/setup', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
  if (r.ok) { show('login-page'); }
  else document.getElementById('setup-alert').innerHTML = `<div class="alert alert-red">${r.error}</div>`;
}

// ── LOGIN ─────────────────────────────────────────────────────────
async function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const r = await apiFetch('/api/admin/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
  if (r.ok) {
    adminToken = r.token;
    localStorage.setItem('admin_token', adminToken);
    showAdminPanel();
  } else {
    document.getElementById('login-alert').innerHTML = `<div class="alert alert-red">${r.error}</div>`;
  }
}

function logout() {
  adminToken = '';
  localStorage.removeItem('admin_token');
  show('login-page');
}

// ── ADMIN PANEL ────────────────────────────────────────────────────
function showAdminPanel() {
  show('admin-panel');
  showPage('dashboard');
}

function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('show');
}
function closeSidebar() {
  document.querySelector('.sidebar')?.classList.remove('open');
  document.getElementById('sidebar-overlay')?.classList.remove('show');
}

function showPage(page) {
  closeSidebar();
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('nav-' + page)?.classList.add('active');
  if (page === 'dashboard') renderDashboard();
  else if (page === 'customers') renderCustomers();
  else if (page === 'docs') renderDocs();
  else if (page === 'settings') renderSettings();
  else if (page === 'blacklist') renderBlacklist();
  else if (page === 'broadcast') renderBroadcast();
  else if (page === 'links') renderLinks();
}

// ── DASHBOARD ─────────────────────────────────────────────────────
async function renderDashboard() {
  document.getElementById('page-title').textContent = 'Dashboard';
  document.getElementById('topbar-actions').innerHTML = '';
  const stats = await apiFetch('/api/admin/stats');
  document.getElementById('page-content').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-num">${stats.total_customers||0}</div><div class="stat-label">Toplam Müşteri</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--accent)">${stats.active_customers||0}</div><div class="stat-label">Aktif Müşteri</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--accent2)">${stats.connected_wa||0}</div><div class="stat-label">Bağlı WhatsApp</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--yellow)">${stats.today_messages||0}</div><div class="stat-label">Bugünkü Mesaj</div></div>
      <div class="stat"><div class="stat-num">${stats.total_messages||0}</div><div class="stat-label">Toplam Mesaj</div></div>
    </div>`;
}

// ── MÜŞTERİLER ────────────────────────────────────────────────────
async function renderCustomers() {
  document.getElementById('page-title').textContent = 'Müşteriler';
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-primary" onclick="openAddCustomer()">+ Müşteri Ekle</button>`;

  const customers = await apiFetch('/api/admin/customers');
  const rows = customers.map(c => `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div>
          <div style="font-weight:700;font-size:15px">${c.name}</div>
          <div style="font-size:12px;color:var(--muted)">${c.email||''}</div>
        </div>
        <span class="badge ${c.status==='active'?'badge-green':'badge-red'}">${c.status==='active'?'Aktif':'Askıda'}</span>
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:monospace;font-size:11px;margin-bottom:10px;cursor:pointer" onclick="copyToken('${c.token}')" title="Kopyala">
        🔑 ${c.token.substring(0,24)}... <span style="color:var(--accent2)">(kopyala)</span>
      </div>
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
        <span class="badge ${c.wa_status==='connected'?'badge-green':c.wa_status==='qr_ready'?'badge-yellow':'badge-gray'}">
          ${c.wa_status==='connected'?'🟢 Bağlı':c.wa_status==='qr_ready'?'🔄 QR':'⚪ Bağlı Değil'}
        </span>
        ${c.wa_number?`<span style="font-size:11px;color:var(--muted)">${c.wa_number}</span>`:''}
        <span class="badge badge-blue">${c.plan}</span>
        ${c.plan === 'demo' ? '<span class="badge" style="background:rgba(255,215,0,.1);color:#ffd700;border-color:rgba(255,215,0,.3)">🎁 Demo</span>' : ''}
        <span style="font-size:11px;color:var(--muted)">${c.plan === 'demo' ? c.daily_limit+' mesaj (toplam)' : c.daily_limit+'/gün'} · ${c.plan === 'demo' ? (c.total_messages||0)+' kullanıldı' : (c.today_messages||0)+' bugün'}</span>
        ${c.expires_at ? `<span style="font-size:11px;color:${new Date(c.expires_at)<new Date()?'var(--red)':'var(--muted)'}">· ${new Date(c.expires_at)<new Date()?'⛔ Süresi doldu':Math.ceil((new Date(c.expires_at)-new Date())/(1000*60*60*24))+' gün kaldı'}</span>` : ''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-blue" style="flex:1;padding:8px" onclick="openConnect(${c.id},'${c.name}')">📱 WhatsApp Bağla</button>
        ${c.phone ? `<button class="btn btn-ghost" style="padding:8px 10px" onclick="openMessageModal(${c.id},'${c.name}')" title="Mesaj Gönder">💬</button>` : ''}
        <button class="btn btn-ghost" style="padding:8px 10px" onclick="openEdit(${c.id})">✏️</button>
        <button class="btn btn-ghost" style="padding:8px 10px" onclick="toggleCustomer(${c.id})">${c.status==='active'?'⏸':'▶'}</button>
        <button class="btn btn-danger" style="padding:8px 10px" onclick="deleteCustomer(${c.id},'${c.name}')">🗑</button>
      </div>
    </div>`).join('');

  document.getElementById('page-content').innerHTML = `
    <div id="customer-list">
      ${rows || '<div style="text-align:center;color:var(--muted);padding:40px">Müşteri yok</div>'}
    </div>`;
}

function copyToClipboard(text) {
  // HTTPS olmayan ortamlar için fallback
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const el = document.createElement('textarea');
  el.value = text;
  el.style.position = 'fixed';
  el.style.opacity = '0';
  document.body.appendChild(el);
  el.focus();
  el.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(el);
}

function openConnect(id, name) {
  currentCustomerId = id;
  openModal(`${name} — WhatsApp Bağlantı`, `
    <div id="conn-status-box" class="conn-status disconnected">⚪ Bağlı Değil</div>
    <div class="qr-method-btns">
      <button class="btn btn-ghost" id="btn-qr" onclick="startConnect('qr')">📷 QR Kod</button>
      <button class="btn btn-ghost" id="btn-pairing" onclick="startConnectPairing()">🔢 Telefon Kodu</button>
      <button class="btn btn-danger" onclick="disconnectWA()">🔌 Bağlantı Kes</button>
    </div>
    <div id="conn-content" class="qr-wrap">
      <div style="color:var(--muted);font-size:13px">Bağlantı yöntemi seçin</div>
    </div>
  `);
  startSSE(id);
  // Mevcut durumu getir
  apiFetch(`/api/admin/customers/${id}/status`).then(s => updateConnUI(s));
}

function startSSE(id) {
  if (sseSource) sseSource.close();
  sseSource = new EventSource(`/api/admin/customers/${id}/events?token=${adminToken}`);
  sseSource.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'qr') {
      document.getElementById('conn-content').innerHTML = `
        <img src="${data.qr_base64}" style="max-width:220px;border-radius:12px">
        <div style="font-size:12px;color:var(--muted);margin-top:8px">WhatsApp → Bağlı Cihazlar → QR Okut</div>`;
    } else if (data.type === 'pairing') {
      if (data.error) {
        document.getElementById('conn-content').innerHTML = `
          <div style="color:#ff4444;font-size:13px;padding:10px">❌ Hata: ${data.error}</div>`;
      } else {
        document.getElementById('conn-content').innerHTML = `
          <div style="font-size:36px;font-weight:800;letter-spacing:8px;color:var(--accent);padding:20px;cursor:pointer;user-select:all"
               onclick="navigator.clipboard?.writeText('${data.code}');this.innerHTML='✅ Kopyalandı!';setTimeout(()=>this.innerHTML='${data.code}',2000)"
               title="Kopyalamak için tıkla">${data.code}</div>
          <div style="font-size:11px;color:var(--accent2);margin-bottom:4px">👆 Koda tıklayarak kopyala</div>
          <div style="font-size:12px;color:var(--muted)">WhatsApp → Bağlı Cihazlar → Telefon Numarasıyla Bağla</div>`;
      }
    } else if (data.type === 'status') {
      updateConnUI(data);
    }
  };
}

function updateConnUI(s) {
  const box = document.getElementById('conn-status-box');
  if (!box) return;
  if (s.status === 'connected') {
    box.className = 'conn-status connected';
    box.textContent = `🟢 Bağlı — ${s.phone || ''}`;
    document.getElementById('conn-content').innerHTML = `<div style="font-size:48px">✅</div><div style="color:var(--accent);margin-top:8px">Bağlantı başarılı!</div>`;
    setTimeout(() => { renderCustomers(); }, 1000);
  } else if (s.status === 'connecting' || s.status === 'qr_ready') {
    box.className = 'conn-status connecting';
    box.textContent = '🔄 Bağlanıyor...';
  } else {
    box.className = 'conn-status disconnected';
    box.textContent = '⚪ Bağlı Değil';
  }
}

  document.getElementById('conn-content').innerHTML = `<div class="spin" style="width:30px;height:30px"></div><div style="color:var(--muted);margin-top:8px;font-size:13px">Hazırlanıyor...</div>`;

async function sendBroadcast() {
  const message = document.getElementById('bc-msg').value.trim();
  const plan_filter = document.getElementById('bc-filter').value;
  if (!message) return alert('Mesaj gerekli');
  if (!confirm(`Duyuru gönderilsin mi?`)) return;

  document.getElementById('bc-result').innerHTML = '<span style="color:var(--muted)">Gönderiliyor...</span>';

  const r = await apiFetch('/api/admin/broadcast', {
    method: 'POST', body: JSON.stringify({ message, plan_filter })
  });

  if (r.ok) {
    const success = r.results.filter(x => x.ok).length;
    const fail = r.results.filter(x => !x.ok).length;
    let html = `<div style="color:var(--accent);margin-bottom:8px">✅ ${success} gönderildi${fail ? ` · ❌ ${fail} başarısız` : ''}</div>`;
    r.results.forEach(x => {
      html += `<div style="font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)">
        <span style="color:${x.ok?'var(--accent)':'var(--red)'}">${x.ok?'✅':'❌'}</span> ${x.name}
        ${x.error ? `<span style="color:var(--red);font-size:11px"> — ${x.error}</span>` : ''}
      </div>`;
    });
    document.getElementById('bc-result').innerHTML = html;
  } else {
    document.getElementById('bc-result').innerHTML = `<span style="color:var(--red)">❌ ${r.error}</span>`;
  }
}

      <div style="font-size:12px;color:var(--muted);margin-bottom:12px">${list.length} kayıt</div>
      ${rows || '<div style="text-align:center;color:var(--muted);padding:30px">Kara listede kimse yok</div>'}
    </div>`;
}

async function removeFromBlacklist(id) {
  if (!confirm('Kara listeden çıkarılsın mı? Tekrar demo alabilir.')) return;
  await apiFetch(`/api/admin/blacklist/${id}`, { method: 'DELETE' });
  renderBlacklist();
}

function openAddBlacklist() {
  openModal('Manuel Kara Liste Ekle', `
    <div class="field"><label>Telefon *</label><input id="bl-phone" placeholder="905551234567"></div>
    <div class="field"><label>Ad</label><input id="bl-name" placeholder="Ahmet Yılmaz"></div>
    <button class="btn btn-primary btn-full" onclick="addToBlacklist()">Ekle</button>
  `);
}

async function addToBlacklist() {
  const r = await apiFetch('/api/admin/blacklist', {
    method: 'POST',
    body: JSON.stringify({
      phone: document.getElementById('bl-phone').value,
      name: document.getElementById('bl-name').value,
      reason: 'manual'
    })
  });
  if (r.ok) { closeModal(); renderBlacklist(); }
  else alert('Hata: ' + r.error);
}

// ── API DÖKÜMAN ───────────────────────────────────────────────────
function renderDocs() {
  document.getElementById('page-title').textContent = 'API Dökümanı';
  document.getElementById('topbar-actions').innerHTML = '';
  const host = window.location.origin;
  document.getElementById('page-content').innerHTML = `
    <div class="card">
      <div class="card-title">Base URL</div>
      <div class="api-doc" style="cursor:pointer" onclick="copyCode(this)" title="Kopyala">${host}/api <span style="color:var(--accent2);font-size:10px">📋</span></div>
    </div>
    <div class="card">
      <div class="card-title">Authentication</div>
      <div class="api-doc" style="cursor:pointer" onclick="copyCode(this)" title="Kopyala">x-api-token: SİZİN_TOKEN <span style="color:var(--accent2);font-size:10px">📋</span></div>
    </div>
    <div class="card">
      <div class="card-title">Endpoints</div>
      <div class="api-doc">
GET  /api/status                → Durum ve plan bilgisi

POST /api/connect               → WhatsApp bağla
     body: { method: "qr"|"pairing", phone: "905551234567" }

POST /api/send                  → Mesaj gönder
     body: { to: "905551234567", message: "Merhaba!" }

POST /api/send/image            → Resim gönder
     body: { to: "...", url: "https://...", caption: "..." }

POST /api/send/document         → Dosya gönder
     body: { to: "...", url: "...", filename: "...", mimetype: "..." }

POST /api/send/bulk             → Toplu mesaj (max 50)
     body: { messages: [{to, message}, ...] }

POST /api/check                 → Numara kontrolü
     body: { phones: ["905551234567"] }
      </div>
    </div>
    <div class="card">
      <div class="card-title">Google Sheets Apps Script Örneği</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">
        ⚠️ Sunucu Termux/PC'de çalışıyorsa dışarıdan erişilemez. VPS'te çalışıyorsa domain/IP kullanın.
      </div>
      <div class="api-doc" style="cursor:pointer;position:relative" onclick="copyCode(this)" title="Kopyalamak için tıkla">
// Apps Script &gt; Araçlar &gt; Komut Dosyası Düzenleyicisi'ne yapıştırın
var API_URL = '${host}/api/send'; // VPS IP: http://1.2.3.4:3000/api/send
var API_TOKEN = 'TOKENINIZI_BURAYA_YAZIN';

function sendWhatsApp(phone, message) {
  var options = {
    method: 'post',
    contentType: 'application/json',
    headers: { 'x-api-token': API_TOKEN },
    payload: JSON.stringify({ to: phone, message: message }),
    muteHttpExceptions: true
  };
  try {
    var response = UrlFetchApp.fetch(API_URL, options);
    var result = JSON.parse(response.getContentText());
    return result.ok ? 'Gönderildi' : 'Hata: ' + result.error;
  } catch(e) {
    return 'Bağlantı hatası: ' + e.message;
  }
}

// Örnek kullanım - Sheets'teki A sütunu telefon, B sütunu mesaj
function sendAllMessages() {
  var sheet = SpreadsheetApp.getActiveSheet();
  var data = sheet.getDataRange().getValues();
  for (var i = 1; i &lt; data.length; i++) {
    var phone = data[i][0].toString().replace(/\D/g,'');
    var message = data[i][1].toString();
    if (phone && message) {
      var result = sendWhatsApp(phone, message);
      sheet.getRange(i+1, 3).setValue(result); // C sütununa sonuç yaz
      Utilities.sleep(800); // Spam koruması
    }
  }
}
      <span style="color:var(--accent2);font-size:10px;position:absolute;top:8px;right:8px">📋 Kopyala</span></div>
    </div>`;
}

// ── MÜŞTERİ PANELİ ────────────────────────────────────────────────
async function showCustomerPanel(token) {
  show('customer-panel');
  if (!token) {
    document.getElementById('cp-content').innerHTML = `
      <div class="field"><label>API Token</label><input id="cp-token" placeholder="Token girin..."></div>
      <button class="btn btn-primary btn-full" onclick="loadCustomerPanel()">Giriş</button>`;
    return;
  }
  loadCustomerPanel(token);
}

async function loadCustomerPanel(token) {
  const t = token || document.getElementById('cp-token')?.value.trim();
  if (!t) return;

  const r = await fetch('/api/status', { headers: { 'x-api-token': t } });
  const data = await r.json();
  if (data.error) {
    document.getElementById('cp-content').innerHTML = `<div class="alert alert-red">${data.error}</div>`;
    return;
  }

  const host = window.location.origin;
  document.getElementById('cp-content').innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:700">${data.customer}</div>
          <div style="font-size:12px;color:var(--muted)">${data.plan} plan · ${data.daily_limit}/gün limit</div>
        </div>
        <span class="badge ${data.wa_status==='connected'?'badge-green':'badge-red'}">
          ${data.wa_status==='connected'?'🟢 Bağlı':'⚪ Bağlı Değil'}
        </span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">API Token</div>
      <div class="token-box" onclick="navigator.clipboard?.writeText('${t}');alert('Kopyalandı!')">${t}</div>
    </div>
    <div class="card">
      <div class="card-title">Mesaj Gönder (Test)</div>
      <div class="field"><label>Telefon</label><input id="test-phone" placeholder="905551234567"></div>
      <div class="field"><label>Mesaj</label><textarea id="test-msg" rows="2" placeholder="Merhaba!"></textarea></div>
      <button class="btn btn-primary" onclick="testSend('${t}')">Gönder</button>
      <div id="test-result" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <div class="card-title">API Kullanımı</div>
      <div class="api-doc">
// Mesaj gönder
POST ${host}/api/send
Header: x-api-token: ${t}
Body: { "to": "905551234567", "message": "Merhaba!" }

// Google Sheets
headers: { 'x-api-token': '${t}' }
      </div>
    </div>`;
}

async function testSend(token) {
  const phone = document.getElementById('test-phone').value.trim();
  const message = document.getElementById('test-msg').value.trim();
  if (!phone || !message) return alert('Telefon ve mesaj gerekli');
  const r = await fetch('/api/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-token': token },
    body: JSON.stringify({ to: phone, message })
  });
  const data = await r.json();
  const el = document.getElementById('test-result');
  el.innerHTML = `<div class="alert ${data.ok?'alert-green':'alert-red'}">${data.ok?'✅ Gönderildi!':'❌ '+data.error}</div>`;
}

// ── MODAL ─────────────────────────────────────────────────────────
function openModal(title, body) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  if (sseSource) { sseSource.close(); sseSource = null; }
}

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});
</script>
